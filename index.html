<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos Táctica</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* --- PANTALLA DE LOGIN / CONTRASEÑA --- */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .login-card h2 {
            margin-top: 0;
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #1f2937;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-card button:hover {
            background-color: var(--accent-hover);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* --- INTERFAZ PRINCIPAL DE BÚSQUEDA --- */
        #main-app {
            display: none; /* Oculta hasta desbloquear */
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 250px;
            padding: 12px 16px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .filter-city {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #3b82f6;
        }

        .card-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>ACCESO RESTRINGIDO</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Introduce la clave para acceder</p>
            <input type="password" id="pass-input" placeholder="Contraseña">
            <button onclick="checkPassword()">ENTRAR</button>
            <div id="error-msg" class="error-msg">Contraseña incorrecta</div>
        </div>
    </div>

    <!-- INTERFAZ DE BÚSQUEDA -->
    <div id="main-app">
        <div class="header">
            <h2>CONSULTA DE FICHAS</h2>
        </div>

        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="Buscar por Nombre, DNI, Mote, Placa..." oninput="filterData()">
            <select id="city-filter" class="filter-city" onchange="filterData()">
                <option value="">Todas las ciudades</option>
            </select>
        </div>

        <div id="results-container" class="results-grid"></div>
    </div>

    <script>
        // CONTRASEÑA DE ACCESO ACTUALIZADA
        const PASSWORD_CORRECTA = "cobra1"; 

        function checkPassword() {
            const inputPass = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (inputPass === PASSWORD_CORRECTA) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Permitir pulsar 'Enter' para entrar
        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // LÓGICA DE FILTRADO E INICIO VACÍO
        let allData = [];

        function filterData() {
            const textQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const cityQuery = document.getElementById('city-filter').value;
            const container = document.getElementById('results-container');

            // Si los campos de búsqueda están vacíos, no muestra nada
            if (!textQuery && !cityQuery) {
                container.innerHTML = '';
                return;
            }

            const filtered = allData.filter(item => {
                const matchCity = !cityQuery || item.CIUDAD === cityQuery;
                const matchText = !textQuery || 
                    (item.NOMBRE && item.NOMBRE.toLowerCase().includes(textQuery)) ||
                    (item.DNI && item.DNI.toLowerCase().includes(textQuery)) ||
                    (item.MOTE && item.MOTE.toLowerCase().includes(textQuery)) ||
                    (item.PLACA1 && item.PLACA1.toLowerCase().includes(textQuery));

                return matchCity && matchText;
            });

            renderCards(filtered);
        }

        function renderCards(data) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.FOTO || 'https://via.placeholder.com/300x200?text=Sin+Foto'}" alt="Foto">
                    <div class="card-body">
                        <div class="card-title">${item.NOMBRE || 'Sin Nombre'}</div>
                        <div class="card-info"><strong>DNI:</strong> ${item.DNI || 'N/A'}</div>
                        <div class="card-info"><strong>Mote:</strong> ${item.MOTE || 'N/A'}</div>
                        <div class="card-info"><strong>Placa:</strong> ${item.PLACA1 || 'N/A'}</div>
                        <span class="badge">${item.CIUDAD || 'Desconocida'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
