<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Fichas Conil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md">
                    <i data-lucide="shield" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">Fichas Conil</h1>
                    <p class="text-xs text-slate-400">Sistema de consulta y gestión operativa</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Pestañas de Navegación -->
                <nav class="flex space-x-1 bg-slate-900 p-1 rounded-xl border border-slate-700">
                    <button onclick="switchTab('search')" id="tab-search" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Buscador</span>
                    </button>
                    <button onclick="switchTab('detail')" id="tab-detail" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5">
                        <i data-lucide="user" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Desglose Ficha</span>
                    </button>
                </nav>

                <!-- Botón Modo Editor / Admin -->
                <button onclick="toggleEditorMode()" id="btn-admin" class="px-3 py-1.5 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg border border-slate-600 transition-all flex items-center space-x-1.5">
                    <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span id="admin-label">Editor (PIN)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">

        <!-- ================= VISTA BUSCADOR ================= -->
        <div id="view-search" class="space-y-6">
            <!-- Barra de Filtros y Búsqueda -->
            <div class="bg-slate-800 p-4 sm:p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Campo de búsqueda -->
                    <div class="md:col-span-2 relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por Nombre, DNI, Mote, Teléfono, Vehículo..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>

                    <!-- Filtro por Campo Específico -->
                    <div>
                        <select id="searchField" onchange="filterData()" class="w-full py-2.5 px-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="all">Todos los campos</option>
                            <option value="NOMBRE">Nombre</option>
                            <option value="DNI">DNI</option>
                            <option value="MOTE">Mote</option>
                            <option value="DOMICILIO1">Domicilio</option>
                            <option value="PLACA">Matrículas / Vehículos</option>
                            <option value="OBSERVACIONES">Observaciones / Naves</option>
                        </select>
                    </div>

                    <!-- Botón limpiar -->
                    <div class="flex items-center">
                        <button onclick="resetFilters()" class="w-full py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-medium text-sm transition-colors flex items-center justify-center space-x-2">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            <span>Limpiar filtros</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-700/60 text-xs text-slate-400">
                    <span id="resultCount">Mostrando 0 registros</span>
                    <span class="italic">Selecciona una tarjeta para ver su desglose completo</span>
                </div>
            </div>

            <!-- Listado de Resultados (Tarjetas) -->
            <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

        <!-- ================= VISTA DESGLOSE DE FICHA ================= -->
        <div id="view-detail" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md">
                <button onclick="switchTab('search')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-sm font-medium flex items-center space-x-2 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Volver al Buscador</span>
                </button>
                <div id="editor-actions" class="hidden flex items-center space-x-2">
                    <button onclick="openEditModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium flex items-center space-x-2 shadow-lg transition-colors">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                        <span>Modificar Ficha</span>
                    </button>
                </div>
            </div>

            <!-- Ficha Detallada -->
            <div id="detailContainer" class="bg-slate-800 rounded-2xl border border-slate-700 p-6 sm:p-8 shadow-2xl space-y-6">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

    </main>

    <!-- Modal de Edición (Protegido por PIN) -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 sm:p-6 border-b border-slate-700 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i data-lucide="file-pen" class="w-5 h-5 text-blue-500"></i>
                    <span>Modificar Registro</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="editFormContent" class="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                <!-- Formulario dinámico -->
            </div>
            <div class="p-4 sm:p-6 border-t border-slate-700 bg-slate-900/50 flex justify-end space-x-3">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-sm font-medium hover:bg-slate-600">Cancelar</button>
                <button onclick="saveChanges()" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-500 shadow-lg">Guardar cambios</button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let dataset = [
            { id: 1, NOMBRE: "VICTOR ARIZA MARCHANTE", DNI: "76089910E", MOTE: "Bombita", FECHA: 1990, DOMICILIO1: "C/ Sierra Blanquilla 12, 1A Medina", PLACA: "4515JZZ TMAX / 2150CZF LEON / CA7808BL GOLF", OBSERVACIONES: "Nave calle Grecia 2" },
            { id: 2, NOMBRE: "JORGE MENA BENITEZ", DNI: "20073884J", MOTE: "", FECHA: 1997, DOMICILIO1: "C/ Resbala 15 Medina", PLACA: "1701CKL", OBSERVACIONES: "Peugeot 206 / Primo araña" },
            { id: 3, NOMBRE: "JOSE LUIS GUTIERREZ MACIAS", DNI: "15443964Q", MOTE: "Palmera", FECHA: 1996, DOMICILIO1: "Ntra. Señora de la Paz, 9, 3A Medina", PLACA: "0467FYR W", OBSERVACIONES: "Polo / Laura Díaz Benítez" },
            { id: 4, NOMBRE: "ALEJANDRO ASTORGA GAMAZA", DNI: "15441148Y", MOTE: "", FECHA: 1989, DOMICILIO1: "C/ Fenicios 19 Medina", PLACA: "7525MRR Honda Adv350 / 3531JJV BMW", OBSERVACIONES: "Nave c/ Alemania 2 / Rosa Mª García Alvarado" },
            { id: 5, NOMBRE: "MANUEL MENDOZA MOTA", DNI: "52303336W", MOTE: "Lili", FECHA: 1966, DOMICILIO1: "C/ Olivo 5 Medina", PLACA: "", OBSERVACIONES: "Menudeo coca Medina" },
            { id: 6, NOMBRE: "LUIS FERNANDEZ FERNANDEZ", DNI: "15444240Q", MOTE: "", FECHA: 1990, DOMICILIO1: "C/ Manuel de falla 8 Medina", PLACA: "9628DDK BMW / 7353FPN BMW 318", OBSERVACIONES: "Cuñado Bombita / Mª Carmen Ariza Marchante" },
            { id: 7, NOMBRE: "CARLOS DE LA FLOR MORENO", DNI: "20073139G", MOTE: "", FECHA: 2004, DOMICILIO1: "Juan XXIII, 2, Bq 3, Esc 2, 3B Medina", PLACA: "SA7184B Seat Leon Gris", OBSERVACIONES: "Nave bombita" },
            { id: 8, NOMBRE: "CRISTIAN FERNANDEZ CASTILLO", DNI: "", MOTE: "Pilita", FECHA: "", DOMICILIO1: "", PLACA: "", OBSERVACIONES: "" },
            { id: 9, NOMBRE: "ALBERTO CARAVACA CASTRO", DNI: "", MOTE: "FUTBOLISTA", FECHA: 1990, DOMICILIO1: "C/ Rodan Greco 27 Medina / C/ Antártida 47, PTA 7 Medina", PLACA: "4832JCZ W Golf", OBSERVACIONES: "Minerva Salas Jiménez" },
            { id: 10, NOMBRE: "JERONIMO CANTERO MACIAS", DNI: "31241315R", MOTE: "", FECHA: 1963, DOMICILIO1: "C/ Tartessos 68, bj Medina", PLACA: "", OBSERVACIONES: "Con Jonatan Rosa en barco en Algeciras" }
        ];

        let currentFilteredData = [...dataset];
        let selectedRecordId = null;
        let isEditorMode = false;

        function init() {
            renderResults(dataset);
            lucide.createIcons();
        }

        function switchTab(tabName) {
            const searchView = document.getElementById('view-search');
            const detailView = document.getElementById('view-detail');
            const tabSearch = document.getElementById('tab-search');
            const tabDetail = document.getElementById('tab-detail');

            if (tabName === 'search') {
                searchView.classList.remove('hidden');
                detailView.classList.add('hidden');
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow";
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5";
            } else {
                if (!selectedRecordId) {
                    selectedRecordId = dataset[0].id;
                }
                searchView.classList.add('hidden');
                detailView.classList.remove('hidden');
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow";
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5";
                renderDetail(selectedRecordId);
            }
            lucide.createIcons();
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const field = document.getElementById('searchField').value;

            currentFilteredData = dataset.filter(item => {
                if (field === 'all') {
                    return Object.values(item).some(val => String(val).toLowerCase().includes(query));
                } else {
                    return String(item[field] || '').toLowerCase().includes(query);
                }
            });

            renderResults(currentFilteredData);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchField').value = 'all';
            currentFilteredData = [...dataset];
            renderResults(dataset);
        }

        function renderResults(data) {
            const grid = document.getElementById('resultsGrid');
            document.getElementById('resultCount').innerText = `Mostrando ${data.length} registros`;

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-slate-800/50 rounded-2xl border border-slate-700">No se encontraron registros coincidentes.</div>`;
                return;
            }

            grid.innerHTML = data.map(item => `
                <div onclick="selectRecord(${item.id})" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-blue-500/50 rounded-2xl p-5 cursor-pointer transition-all shadow-lg flex flex-col justify-between group">
                    <div class="space-y-3">
                        <div class="flex items-start justify-between">
                            <span class="px-2.5 py-1 bg-blue-500/10 text-blue-400 rounded-lg text-xs font-semibold uppercase tracking-wider border border-blue-500/20">
                                ${item.MOTE ? 'Mote: ' + item.MOTE : 'Ficha Operativa'}
                            </span>
                            <span class="text-xs text-slate-400 font-mono">${item.FECHA || 'S/F'}</span>
                        </div>
                        <div>
                            <h3 class="text-base font-bold text-white group-hover:text-blue-400 transition-colors">${item.NOMBRE || 'SIN NOMBRE'}</h3>
                            <p class="text-xs text-slate-400 font-mono mt-0.5">DNI: ${item.DNI || 'No registrado'}</p>
                        </div>
                        <div class="text-xs text-slate-300 space-y-1 pt-2 border-t border-slate-700/60">
                            <p class="truncate"><strong class="text-slate-400">Domicilio:</strong> ${item.DOMICILIO1 || 'No especificado'}</p>
                            <p class="truncate"><strong class="text-slate-400">Vehículos:</strong> ${item.PLACA || 'Ninguno'}</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 flex items-center justify-between text-xs text-blue-400 font-medium">
                        <span>Ver desglose completo</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 transform group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function selectRecord(id) {
            selectedRecordId = id;
            switchTab('detail');
        }

        function renderDetail(id) {
            const item = dataset.find(d => d.id === id);
            const container = document.getElementById('detailContainer');
            if (!item) return;

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-700 gap-4">
                    <div>
                        <div class="flex items-center space-x-3">
                            <span class="px-3 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider">ID: #${item.id}</span>
                            ${item.MOTE ? `<span class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-lg text-xs font-semibold">Mote: ${item.MOTE}</span>` : ''}
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-2">${item.NOMBRE}</h2>
                    </div>
                    <div class="text-left sm:text-right">
                        <span class="text-xs text-slate-400 block">Año / Ficha</span>
                        <span class="text-lg font-mono font-bold text-slate-200">${item.FECHA || 'No especificada'}</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                    <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700 space-y-3 shadow-inner">
                        <h4 class="text-sm font-semibold text-blue-400 flex items-center space-x-2">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                            <span>Datos Identificativos</span>
                        </h4>
                        <div class="space-y-2 text-sm">
                            <p><strong class="text-slate-400">Nombre Completo:</strong> <span class="text-slate-200">${item.NOMBRE || '-'}</span></p>
                            <p><strong class="text-slate-400">DNI / Documento:</strong> <span class="text-slate-200 font-mono">${item.DNI || '-'}</span></p>
                            <p><strong class="text-slate-400">Mote / Alias:</strong> <span class="text-slate-200">${item.MOTE || '-'}</span></p>
                        </div>
                    </div>

                    <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700 space-y-3 shadow-inner">
                        <h4 class="text-sm font-semibold text-blue-400 flex items-center space-x-2">
                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                            <span>Domicilios y Ubicaciones</span>
                        </h4>
                        <div class="space-y-2 text-sm">
                            <p><strong class="text-slate-400">Domicilio Principal:</strong> <span class="text-slate-200">${item.DOMICILIO1 || '-'}</span></p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700 space-y-3 shadow-inner">
                        <h4 class="text-sm font-semibold text-blue-400 flex items-center space-x-2">
                            <i data-lucide="car" class="w-4 h-4"></i>
                            <span>Vehículos y Matrículas</span>
                        </h4>
                        <div class="space-y-2 text-sm">
                            <p class="text-slate-200 font-mono bg-slate-800 p-3 rounded-lg border border-slate-700">${item.PLACA || 'Sin vehículos registrados'}</p>
                        </div>
                    </div>

                    <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700 space-y-3 shadow-inner">
                        <h4 class="text-sm font-semibold text-blue-400 flex items-center space-x-2">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            <span>Observaciones / Naves / Relaciones</span>
                        </h4>
                        <div class="space-y-2 text-sm">
                            <p class="text-slate-200 bg-slate-800 p-3 rounded-lg border border-slate-700">${item.OBSERVACIONES || 'Sin observaciones adicionales'}</p>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function toggleEditorMode() {
            if (!isEditorMode) {
                const pin = prompt("Introduce el PIN de Administrador:");
                if (pin === "1234") {
                    isEditorMode = true;
                    document.getElementById('admin-label').innerText = "Editor Activo";
                    document.getElementById('btn-admin').className = "px-3 py-1.5 text-xs font-semibold bg-emerald-600 text-white rounded-lg border border-emerald-500 shadow-lg flex items-center space-x-1.5";
                    document.getElementById('editor-actions').classList.remove('hidden');
                    alert("Modo Editor activado.");
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            } else {
                isEditorMode = false;
                document.getElementById('admin-label').innerText = "Editor (PIN)";
                document.getElementById('btn-admin').className = "px-3 py-1.5 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg border border-slate-600 flex items-center space-x-1.5";
                document.getElementById('editor-actions').classList.add('hidden');
                alert("Modo Editor desactivado.");
            }
        }

        function openEditModal() {
            const item = dataset.find(d => d.id === selectedRecordId);
            if (!item) return;

            const formContent = document.getElementById('editFormContent');
            formContent.innerHTML = `
                <input type="hidden" id="edit-id" value="${item.id}">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nombre</label>
                    <input type="text" id="edit-nombre" value="${item.NOMBRE || ''}" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">DNI</label>
                        <input type="text" id="edit-dni" value="${item.DNI || ''}" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Mote</label>
                        <input type="text" id="edit-mote" value="${item.MOTE || ''}" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Domicilio</label>
                    <input type="text" id="edit-domicilio" value="${item.DOMICILIO1 || ''}" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Matrículas / Vehículos</label>
                    <input type="text" id="edit-placa" value="${item.PLACA || ''}" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Observaciones / Naves</label>
                    <textarea id="edit-obs" rows="3" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">${item.OBSERVACIONES || ''}</textarea>
                </div>
            `;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveChanges() {
            const id = parseInt(document.getElementById('edit-id').value);
            const index = dataset.findIndex(d => d.id === id);
            if (index !== -1) {
                dataset[index].NOMBRE = document.getElementById('edit-nombre').value;
                dataset[index].DNI = document.getElementById('edit-dni').value;
                dataset[index].MOTE = document.getElementById('edit-mote').value;
                dataset[index].DOMICILIO1 = document.getElementById('edit-domicilio').value;
                dataset[index].PLACA = document.getElementById('edit-placa').value;
                dataset[index].OBSERVACIONES = document.getElementById('edit-obs').value;

                renderDetail(id);
                filterData();
                closeEditModal();
                alert("Cambios actualizados correctamente en la vista.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
