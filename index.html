<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONSULTA BBDD OPERATIVA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- Estilo para sombrear las coincidencias del buscador -->
    <style>
        mark {
            background-color: #facc15;
            color: #020617;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
    <!-- Script principal cargado en el head -->
    <script>
        let allData = [];
        let selectedRecordId = null;
        let currentPage = 1;
        let lastScrollPosition = 0; // Guardará la posición exacta del scroll al entrar en una ficha
        const itemsPerPage = 40;

        function verificarClave() {
            const input = document.getElementById('passwordInput');
            const authError = document.getElementById('authError');
            
            if (!input) return;
            const pass = input.value.trim().toLowerCase();

            if (pass === "udyco") {
                if (authError) authError.classList.add('hidden');
                input.blur();
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                window.scrollTo(0, 0);
                loadData();
            } else {
                if (authError) authError.classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                const resultCount = document.getElementById('resultCount');
                if (resultCount) resultCount.innerText = "Conectando con el servidor...";
                
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo encontrar el archivo data.json.");
                
                const rawData = await response.json();
                
                // Mapeo seguro con índices internos
                allData = rawData.map((item, index) => ({
                    ...item,
                    _internalId: index
                }));

                document.getElementById('totalDbCount').innerText = allData.length;

                const localidades = [...new Set(allData.map(item => item.CIUDAD).filter(Boolean))].sort();
                const citySelect = document.getElementById('cityFilter');
                if (citySelect) {
                    citySelect.innerHTML = '<option value="">Todas las localidades</option>' + 
                        localidades.map(loc => `<option value="${loc}">${loc}</option>`).join('');
                }

                document.getElementById('dbStatusDot').className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50 animate-pulse";
                document.getElementById('dbStatusText').innerText = "Conectado";
                if (resultCount) resultCount.innerText = "Escribe para buscar registros.";
                document.getElementById('resultsGrid').innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
            } catch (error) {
                console.error("Error al cargar data.json:", error);
                document.getElementById('dbStatusDot').className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-red-500 shadow-lg";
                document.getElementById('dbStatusText').innerText = "Sin conexión a BBDD";
                const resultCount = document.getElementById('resultCount');
                if (resultCount) resultCount.innerText = "Aviso: No se encuentra o no se puede leer el archivo data.json.";
                document.getElementById('resultsGrid').innerHTML = `<div class="col-span-full py-12 text-center text-amber-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">El sistema ha abierto la interfaz, pero el archivo 'data.json' no responde. Revisa que esté en la misma carpeta que este archivo HTML.</div>`;
            }
        }

        function getInitials(name) {
            if (!name) return "FP";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function cleanDocString(doc) {
            if (!doc) return '';
            return doc.trim().replace(/[^a-zA-Z0-9]/g, '');
        }

        function getPhotoUrl(item) {
            const cleanDoc = cleanDocString(item.DNI);
            if (cleanDoc !== '') {
                return `fotos/${cleanDoc.toUpperCase()}.jpg`;
            }
            return null;
        }

        function handleImageError(imgElement, dni) {
            const step = parseInt(imgElement.dataset.step || '0', 10);
            const cleanDoc = cleanDocString(dni);

            if (step === 0 && cleanDoc) {
                imgElement.dataset.step = '1';
                imgElement.src = `fotos/${cleanDoc.toLowerCase()}.jpg`;
            } else if (step === 1 && cleanDoc) {
                imgElement.dataset.step = '2';
                imgElement.src = `fotos/${cleanDoc}.jpeg`;
            } else {
                imgElement.remove();
            }
        }

        function normalizeText(text) {
            if (!text) return "";
            return text.toString()
                       .normalize("NFD")
                       .replace(/[\u0300-\u036f]/g, "")
                       .trim()
                       .toUpperCase();
        }

        function highlightText(text, query) {
            if (!text) return '-';
            const strText = String(text);
            if (!query || query.trim() === '') return strText;
            
            try {
                const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regex = new RegExp(`(${escapedQuery})`, 'gi');
                return strText.replace(regex, '<mark>$1</mark>');
            } catch (e) {
                return strText;
            }
        }

        function formatAddress(addressText, query) {
            if (!addressText) return '<span class="text-slate-500 italic">Sin domicilio</span>';
            const coordRegex = /(-?\d{1,2}\.\d+),\s*(-?\s*\d{1,3}\.\d+)/g;
            
            if (coordRegex.test(addressText)) {
                return addressText.replace(coordRegex, (match, lat, lon) => {
                    const cleanLat = lat.trim();
                    const cleanLon = lon.trim();
                    return `<a href="https://www.google.com/maps/search/?api=1&query=${cleanLat},${cleanLon}" target="_blank" class="text-blue-400 hover:underline inline-flex items-center space-x-1 font-mono font-bold bg-blue-500/10 px-1 py-0.5 rounded border border-blue-500/20" onclick="event.stopPropagation();"><span>📍</span><span>${match}</span></a>`;
                });
            }
            return highlightText(addressText, query);
        }

        function switchTab(tabName) {
            const searchView = document.getElementById('view-search');
            const detailView = document.getElementById('view-detail');

            if (tabName === 'search') {
                searchView.classList.remove('hidden');
                detailView.classList.add('hidden');
                // Restauramos la posición del scroll exactamente donde estaba el usuario al cerrar la ficha
                setTimeout(() => {
                    window.scrollTo({ top: lastScrollPosition, behavior: 'instant' });
                }, 10);
            } else {
                searchView.classList.add('hidden');
                detailView.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function filterData(resetPage = true) {
            if (resetPage) currentPage = 1;

            const queryInput = document.getElementById('searchInput');
            const cityFilter = document.getElementById('cityFilter');
            const grid = document.getElementById('resultsGrid');
            const resultCount = document.getElementById('resultCount');
            const paginationTop = document.getElementById('paginationTop');
            const paginationBottom = document.getElementById('paginationBottom');

            if (!queryInput || !grid) return;

            const query = queryInput.value.toLowerCase().trim();
            const selectedCity = cityFilter ? cityFilter.value : '';

            if (query === '' && !selectedCity) {
                grid.innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
                resultCount.innerText = "Esperando búsqueda...";
                if (paginationTop) paginationTop.innerHTML = '';
                if (paginationBottom) paginationBottom.innerHTML = '';
                return;
            }

            const filtered = allData.filter(item => {
                if (selectedCity) {
                    const itemCityNorm = normalizeText(item.CIUDAD);
                    const selectedCityNorm = normalizeText(selectedCity);
                    if (itemCityNorm !== selectedCityNorm) return false;
                }
                if (query === '') return true;
                return Object.values(item).some(val => String(val).toLowerCase().includes(query));
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, endIndex);

            resultCount.innerText = `Mostrando registros del ${filtered.length > 0 ? startIndex + 1 : 0} al ${Math.min(endIndex, filtered.length)} de ${filtered.length} coincidentes`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">No se encontraron registros coincidentes.</div>`;
                if (paginationTop) paginationTop.innerHTML = '';
                if (paginationBottom) paginationBottom.innerHTML = '';
                return;
            }

            grid.innerHTML = paginatedItems.map(item => {
                const initials = getInitials(item.NOMBRE);
                const plates = [];
                if (item.PLACA1) plates.push(item.PLACA1);
                if (item.PLACA2) plates.push(item.PLACA2);
                if (item.PLACA3) plates.push(item.PLACA3);
                if (item.PLACA4) plates.push(item.PLACA4);

                const photoUrl = getPhotoUrl(item);

                const highlightedName = highlightText(item.NOMBRE || 'SIN NOMBRE', query);
                const highlightedDni = highlightText(item.DNI || '-', query);
                const highlightedFecha = highlightText(item.FECHA || '-', query);
                const formattedDomicilio = formatAddress(item.DOMICILIO1, query);
                const hasMote = item.MOTE && item.MOTE.trim() !== '' && item.MOTE.trim().toLowerCase() !== 'ninguno';

                return `
                    <div onclick="selectRecord(${item._internalId})" class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-xl p-2 sm:p-4 shadow-xl flex flex-col justify-between group transition-all space-y-1.5 sm:space-y-2.5 cursor-pointer">
                        <div class="space-y-1.5 sm:space-y-2.5">
                            <!-- Fila superior: Mote arriba a la izquierda (si existe) + Localidad -->
                            <div class="flex items-center justify-between pb-1">
                                ${hasMote ? `<span class="px-1.5 py-0.5 bg-amber-500/10 text-amber-400 rounded text-[9px] sm:text-xs font-bold border border-amber-500/30 truncate max-w-[120px]" title="${item.MOTE}">${highlightText(item.MOTE, query)}</span>` : '<span></span>'}
                                <span class="px-1 py-0.2 bg-blue-500/10 text-blue-400 rounded text-[7px] sm:text-[10px] font-bold uppercase tracking-wider border border-blue-500/20 inline-block">
                                    ${item.CIUDAD || 'LOCALIDAD'}
                                </span>
                            </div>

                            <div class="flex items-center space-x-2.5 sm:space-x-3.5 pb-2 border-b border-slate-800">
                                <div class="w-16 h-20 sm:w-28 sm:h-36 bg-slate-950 border border-slate-700/80 rounded-lg sm:rounded-xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden group-hover:border-blue-500/80 transition-colors relative">
                                    <span class="text-blue-400 font-extrabold text-sm sm:text-2xl tracking-wider">${initials}</span>
                                    ${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover object-top rounded-lg sm:rounded-xl z-10" onerror="handleImageError(this, '${item.DNI}');">` : ''}
                                </div>
                                <div class="min-w-0 flex-1 space-y-0.5">
                                    <h3 class="text-[9px] sm:text-xs font-semibold text-white group-hover:text-blue-400 transition-colors leading-tight line-clamp-3">${highlightedName}</h3>
                                </div>
                            </div>

                            <div class="space-y-1 text-[10px] sm:text-xs">
                                <div class="bg-slate-950/80 px-1.5 py-1 rounded border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 text-[9px] sm:text-[11px]">DNI / NIE:</span>
                                    <span class="text-slate-100 font-mono font-semibold truncate ml-1">${highlightedDni}</span>
                                </div>
                                <div class="hidden sm:flex bg-slate-950/80 p-2 rounded-lg border border-slate-800/80 justify-between items-center">
                                    <span class="text-slate-400">AÑO:</span>
                                    <span class="text-slate-100 font-mono">${highlightedFecha}</span>
                                </div>
                                <div class="bg-slate-950/80 px-1.5 py-1 rounded border border-slate-800/80 space-y-0.5">
                                    <span class="text-slate-400 block text-[9px] sm:text-[10px]">DOMICILIO:</span>
                                    <div class="text-slate-200 truncate text-[10px] sm:text-xs">${formattedDomicilio}</div>
                                </div>
                                <div class="hidden sm:block bg-slate-950/80 p-2 rounded-lg border border-slate-800/80 space-y-1">
                                    <span class="text-slate-400 block text-[10px]">VEHÍCULOS:</span>
                                    <div class="flex flex-wrap gap-1">
                                        ${plates.length > 0 ? plates.map(p => `
                                            <span class="bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700 text-[9px] font-mono text-blue-300 flex items-center space-x-1">
                                                <span>🚗</span>
                                                <span>${highlightText(p, query)}</span>
                                            </span>
                                        `).join('') : '<span class="text-slate-500 italic text-[10px]">Ninguno</span>'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pt-1.5 sm:pt-2 flex items-center justify-end border-t border-slate-800">
                            <span class="text-[10px] sm:text-[11px] text-blue-400 font-medium group-hover:underline flex items-center space-x-1 py-0.5">
                                <span>Ver detalle →</span>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const paginationHtml = totalPages <= 1 ? '' : `
                <div class="flex items-center justify-center space-x-3 py-3 bg-slate-900/50 rounded-2xl border border-slate-800 my-3 text-xs sm:text-sm">
                    <button type="button" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 border border-slate-800 rounded-xl cursor-not-allowed font-medium"' : 'class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl cursor-pointer font-medium transition-colors"'}>
                        ← Anterior
                    </button>
                    <span class="text-slate-300 font-mono px-2">
                        Página <strong class="text-blue-400">${currentPage}</strong> de <strong class="text-slate-100">${totalPages}</strong>
                    </span>
                    <button type="button" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 border border-slate-800 rounded-xl cursor-not-allowed font-medium"' : 'class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl cursor-pointer font-medium transition-colors"'}>
                        Siguiente →
                    </button>
                </div>
            `;

            const topContainer = document.getElementById('paginationTop');
            const bottomContainer = document.getElementById('paginationBottom');
            
            if (topContainer) topContainer.innerHTML = paginationHtml;
            if (bottomContainer) bottomContainer.innerHTML = paginationHtml;
        }

        function changePage(targetPage) {
            currentPage = targetPage;
            filterData(false);
            // Al cambiar de página (arriba o abajo), la vista sube suavemente al principio de la página
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = '';
            filterData(true);
        }

        function selectRecord(id) {
            // Guardamos la posición exacta actual del scroll justo antes de salir al detalle
            lastScrollPosition = window.pageYOffset || document.documentElement.scrollTop;

            const numericId = parseInt(id, 10);
            const item = allData.find(d => d._internalId === numericId);
            const container = document.getElementById('detailContainer');
            
            if (!item) {
                alert("Error: No se encontró el registro con ID " + id);
                return;
            }

            const initials = getInitials(item.NOMBRE);
            const plates = [];
            if (item.PLACA1) plates.push(item.PLACA1);
            if (item.PLACA2) plates.push(item.PLACA2);
            if (item.PLACA3) plates.push(item.PLACA3);
            if (item.PLACA4) plates.push(item.PLACA4);

            const photoUrl = getPhotoUrl(item);

            container.innerHTML = `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-8 shadow-2xl space-y-5">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-5 pb-5 border-b border-slate-800 text-center sm:text-left">
                        <div class="w-40 h-48 sm:w-44 sm:h-52 bg-slate-950 border-2 border-slate-700 rounded-2xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden relative">
                            <span class="text-blue-400 font-black text-4xl tracking-wider">${initials}</span>
                            ${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover object-top rounded-2xl z-10" onerror="handleImageError(this, '${item.DNI}');">` : ''}
                        </div>
                        <div class="space-y-2">
                            <div class="flex flex-wrap gap-2 items-center justify-center sm:justify-start">
                                <span class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider inline-block">
                                    ${item.CIUDAD || 'LOCALIDAD'}
                                </span>
                                ${item.MOTE && item.MOTE.trim() !== '' && item.MOTE.trim().toLowerCase() !== 'ninguno' ? `<span class="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold">${item.MOTE}</span>` : ''}
                            </div>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight leading-snug">${item.NOMBRE || 'SIN NOMBRE'}</h2>
                            <p class="text-xs text-slate-400 font-mono">ID Interno: #${item._internalId}</p>
                        </div>
                    </div>

                    <div class="space-y-2.5 text-sm">
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                            <span class="text-slate-400">DNI / NIE:</span>
                            <span class="text-slate-100 font-mono font-semibold">${item.DNI || 'No registrado'}</span>
                        </div>
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                            <span class="text-slate-400">AÑO:</span>
                            <span class="text-slate-100 font-mono">${item.FECHA || 'No especificado'}</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">DOMICILIOS:</span>
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200">
                            <span>📍</span>
                            <span>${formatAddress(item.DOMICILIO1, '')}</span>
                        </div>
                        ${item.DOMICILIO2 ? `<div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200"><span>📍</span><span>${formatAddress(item.DOMICILIO2, '')}</span></div>` : ''}
                        ${item.DOMICILIO3 ? `<div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200"><span>📍</span><span>${formatAddress(item.DOMICILIO3, '')}</span></div>` : ''}
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">VEHÍCULOS / PLACAS:</span>
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${plates.length > 0 ? plates.map(p => `
                                <div class="bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs font-mono text-slate-200 flex items-center space-x-2">
                                    <span>🚗</span>
                                    <span>${p}</span>
                                </div>
                            `).join('') : '<span class="text-xs text-slate-500 italic">Ningún vehículo registrado</span>'}
                        </div>
                        ${item.OBSERVACIONES ? `
                            <div class="mt-3 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-xs text-slate-300">
                                <strong class="text-slate-400 block mb-1">Observaciones / Naves:</strong>
                                ${item.OBSERVACIONES}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            switchTab('detail');
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- ================= PANTALLA DE ACCESO PRINCIPAL ================= -->
    <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-950 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6 text-center my-auto">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
                <p class="text-xs text-slate-400">Introduce la contraseña de acceso principal.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." autocomplete="current-password" onkeydown="if(event.key === 'Enter') verificarClave()" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base tracking-widest">
                <button type="button" onclick="verificarClave()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg transition-colors cursor-pointer active:scale-98">
                    Entrar al Sistema
                </button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="mainApp" style="display: none;" class="h-full flex-col">
        <!-- Header / Navbar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md flex-shrink-0">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white">CONSULTA BBDD</h1>
                        <p class="text-[10px] sm:text-xs text-slate-400">Base de datos unificada</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="flex items-center space-x-2 bg-slate-950 px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
                        <div class="flex items-center space-x-1.5">
                            <span id="dbStatusDot" class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-amber-500 shadow-lg"></span>
                            <span id="dbStatusText" class="hidden md:inline text-slate-300 font-medium">Cargando...</span>
                        </div>
                        <span class="hidden md:inline text-slate-600">|</span>
                        <div class="text-slate-300 font-mono">
                            Registros: <strong id="totalDbCount" class="text-blue-400">0</strong>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-6 overflow-y-auto">
            <div id="view-search" class="space-y-4">
                <div class="bg-slate-900 p-3 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3 sm:space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                        <div class="sm:col-span-1.5 relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </span>
                            <input type="text" id="searchInput" oninput="filterData()" placeholder="Nombre, DNI, NIE, Mote, Matrícula..." class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>

                        <div>
                            <select id="cityFilter" onchange="filterData()" class="w-full py-3 px-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer">
                                <option value="">Todas las localidades</option>
                            </select>
                        </div>

                        <div class="flex items-center">
                            <button type="button" onclick="resetFilters()" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-sm transition-colors flex items-center justify-center space-x-2 cursor-pointer">
                                <span>Limpiar filtros</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400 px-1">
                        <span id="resultCount">Cargando registros...</span>
                    </div>
                </div>

                <!-- Paginación superior -->
                <div id="paginationTop"></div>

                <!-- Cuadrícula -->
                <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4"></div>
                
                <!-- Paginación inferior -->
                <div id="paginationBottom"></div>
            </div>

            <!-- Vista de detalle -->
            <div id="view-detail" class="hidden space-y-4 sm:space-y-6 max-w-2xl mx-auto">
                <div class="flex items-center justify-between bg-slate-900 px-4 py-3 rounded-xl border border-slate-800">
                    <button type="button" onclick="switchTab('search')" class="text-xs sm:text-sm text-blue-400 font-medium hover:underline flex items-center space-x-1 cursor-pointer">
                        <span>← Volver al buscador</span>
                    </button>
                    <span class="text-xs text-slate-400 font-mono">Ficha de Registro</span>
                </div>
                <div id="detailContainer"></div>
            </div>
        </main>
    </div>

</body>
</html>
