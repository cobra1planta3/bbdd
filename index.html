<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONSULTA BBDD OPERATIVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>mark { background-color: rgba(250, 204, 21, 0.15); color: #facc15; text-decoration: underline; text-decoration-color: #facc15; padding: 0 1px; border-radius: 2px; font-weight: bold; }</style>
    <script>
        let allData = [], page = 1, lastScroll = 0;
        const perPage = 40, el = id => document.getElementById(id);
        const cleanDoc = doc => doc ? doc.trim().replace(/[^a-zA-Z0-9]/g, '') : '';
        const getPhoto = dni => cleanDoc(dni) ? `fotos/${cleanDoc(dni).toUpperCase()}.jpg` : null;
        const norm = t => t ? t.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase() : "";
        const esMoto = t => t && /\b(moto|scooter|ciclomotor|quad|triciclo|tmax|t-max|nmax|n-max|xmax|x-max|scoopy|vespa|piaggio|kymco|sym|burgman|pcx|sh125|sh300|z900|z800|z750|mt07|mt09|mt03|gs1200|gs1250|monster|beverly|agility|liberty|zip|typhoon|jog|aerox|neox|sr50|senda|dt125|duke|cbr|r1|r6|ninja|vstrom|varadero|transalp|harley|custom|enduro|cross|ktm|aprilia|derbi|rieju|keeway)\b/i.test(t);

        function verificarClave() {
            if (el('passwordInput').value.trim().toLowerCase() === "udyco") {
                el('authError').classList.add('hidden');
                el('authScreen').style.display = 'none';
                el('mainApp').style.display = 'flex';
                window.scrollTo(0, 0);
                loadData();
            } else {
                el('authError').classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                el('resultCount').innerText = "Conectando...";
                const res = await fetch('data.json?t=' + Date.now());
                if (!res.ok) throw new Error();
                allData = (await res.json()).map((item, i) => ({ ...item, _id: i }));
                el('totalDbCount').innerText = allData.length;
                
                const ciu = [...new Set(allData.map(i => i.CIUDAD).filter(Boolean))].sort();
                el('cityFilter').innerHTML = '<option value="">Todas las localidades</option>' + ciu.map(c => `<option value="${c}">${c}</option>`).join('');
                
                el('dbStatusDot').className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg animate-pulse";
                el('dbStatusText').innerText = "Conectado";
                el('resultCount').innerText = "Escribe para buscar registros.";
                el('resultsGrid').innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm">Utiliza el buscador o selecciona una localidad.</div>`;
            } catch {
                el('dbStatusDot').className = "w-3 h-3 rounded-full bg-red-500 shadow-lg";
                el('dbStatusText').innerText = "Sin conexión";
                el('resultCount').innerText = "Error: No se encuentra data.json.";
            }
        }

        function imgError(img, dni) {
            let step = parseInt(img.dataset.step || '0', 10), doc = cleanDoc(dni);
            if (step === 0 && doc) { img.dataset.step = '1'; img.src = `fotos/${doc.toLowerCase()}.jpg`; }
            else if (step === 1 && doc) { img.dataset.step = '2'; img.src = `fotos/${doc}.jpeg`; }
            else img.remove();
        }

        function highlight(text, q) {
            if (!text) return '-';
            const str = String(text);
            if (!q || !q.trim()) return str;
            try { return str.replace(new RegExp(`(${q.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>'); } catch { return str; }
        }

        function formatAddr(addr, q) {
            if (!addr) return '';
            const c = addr.match(/(-?\d{1,2}\.\d+),\s*(-?\s*\d{1,3}\.\d+)/);
            if (c) return `<a href="https://www.google.com/maps/search/?api=1&query=${c[1]},${c[2]}" target="_blank" class="text-blue-400 hover:underline font-mono bg-blue-500/10 px-1 rounded border border-blue-500/20" onclick="event.stopPropagation()">📍 ${addr}</a>`;
            return highlight(addr, q);
        }

        function copiarTexto(e, texto, btn) {
            e.stopPropagation();
            if (!texto || texto === '-') return;
            navigator.clipboard.writeText(texto).then(() => {
                const orig = btn.innerText;
                btn.innerText = '✓ Copiado';
                btn.classList.add('text-emerald-400');
                setTimeout(() => { btn.innerText = orig; btn.classList.remove('text-emerald-400'); }, 1200);
            });
        }

        function switchTab(tab) {
            if (tab === 'search') {
                el('view-search').classList.remove('hidden'); el('view-detail').classList.add('hidden');
                setTimeout(() => { document.querySelector('main').scrollTop = lastScroll; window.scrollTo(0, lastScroll); }, 10);
            } else {
                el('view-search').classList.add('hidden'); el('view-detail').classList.remove('hidden');
                document.querySelector('main').scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function changePage(targetPage) {
            page = targetPage;
            filterData(false);
            const mainContainer = document.querySelector('main');
            if (mainContainer) mainContainer.scrollTo({ top: 0, behavior: 'smooth' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterData(reset = true) {
            if (reset) page = 1;
            const q = el('searchInput').value.trim(), city = el('cityFilter').value;
            const grid = el('resultsGrid'), countEl = el('resultCount');

            if (!q && !city) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm">Utiliza el buscador o selecciona una localidad.</div>`;
                countEl.innerText = "Esperando búsqueda...";
                el('paginationTop').innerHTML = el('paginationBottom').innerHTML = '';
                return;
            }

            const normQ = norm(q);
            const filtered = allData.filter(i => {
                if (city && norm(i.CIUDAD) !== norm(city)) return false;
                if (!normQ) return true;
                return Object.entries(i).some(([key, val]) => key !== '_id' && norm(val).includes(normQ));
            });

            const totalPages = Math.ceil(filtered.length / perPage) || 1;
            if (page > totalPages) page = totalPages;

            const start = (page - 1) * perPage, slice = filtered.slice(start, start + perPage);
            countEl.innerText = `Mostrando ${filtered.length ? start + 1 : 0} al ${Math.min(start + perPage, filtered.length)} de ${filtered.length} coincidentes`;

            if (!filtered.length) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm">No se encontraron registros.</div>`;
                el('paginationTop').innerHTML = el('paginationBottom').innerHTML = '';
                return;
            }

            grid.innerHTML = slice.map(item => {
                const plates = [item.PLACA1, item.PLACA2, item.PLACA3, item.PLACA4].filter(Boolean);
                const addrs = [item.DOMICILIO1, item.DOMICILIO2, item.DOMICILIO3].filter(Boolean);
                const isMuerto = item.OBSERVACIONES && /muerto|fallecido/i.test(item.OBSERVACIONES);
                const photo = getPhoto(item.DNI);
                const initials = item.NOMBRE ? (item.NOMBRE.trim().split(" ")[1] ? item.NOMBRE[0] + item.NOMBRE.trim().split(" ")[1][0] : item.NOMBRE.substring(0, 2)).toUpperCase() : "FP";

                return `
                    <div class="bg-slate-900 border ${isMuerto ? 'border-red-500/80' : 'border-slate-800'} hover:border-blue-500/50 rounded-xl p-2.5 shadow-xl flex flex-col justify-between relative overflow-hidden space-y-1">
                        ${isMuerto ? '<div class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-55"><div class="w-full h-2 bg-red-600 transform rotate-45 absolute"></div><div class="w-full h-2 bg-red-600 transform -rotate-45 absolute"></div></div>' : ''}
                        
                        <div class="space-y-1 relative z-10" onclick="event.stopPropagation()">
                            ${item.MOTE && item.MOTE.toLowerCase() !== 'ninguno' ? `<div class="text-amber-400 font-bold text-[10px] sm:text-xs truncate select-text">${highlight(item.MOTE, q)}</div>` : '<div class="h-1"></div>'}
                            
                            <div class="flex items-center space-x-2 pb-1.5 border-b border-slate-800">
                                <div onclick="selectRecord(${item._id})" class="w-12 h-16 sm:w-20 sm:h-28 bg-slate-950 border border-slate-700/80 rounded-lg flex items-center justify-center flex-shrink-0 overflow-hidden relative cursor-pointer">
                                    <span class="text-blue-400 font-extrabold text-xs">${initials}</span>
                                    ${photo ? `<img src="${photo}" class="absolute inset-0 w-full h-full object-cover object-top rounded-lg z-10" onerror="imgError(this, '${item.DNI}')">` : ''}
                                </div>
                                <div class="min-w-0 flex-1 flex flex-col justify-between self-stretch py-0.5">
                                    <h3 onclick="selectRecord(${item._id})" class="text-[10px] sm:text-xs font-semibold text-white line-clamp-2 cursor-pointer select-text hover:text-blue-400 transition-colors">${highlight(item.NOMBRE || 'SIN NOMBRE', q)}</h3>
                                    <div class="flex justify-between items-center pt-1 select-text">
                                        <span class="text-slate-200 text-xs sm:text-sm font-mono font-bold">${highlight(item.FECHA || 'S/A', q)}</span>
                                        <span class="text-blue-400 text-xs sm:text-sm font-bold uppercase">${highlight(item.CIUDAD || 'LOCALIDAD', q)}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-0.5 text-[10px] sm:text-xs pt-0.5 select-text">
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800 flex justify-between items-center">
                                    <span class="text-slate-400">DNI:</span>
                                    <div class="flex items-center space-x-1">
                                        <span class="text-slate-100 font-mono font-semibold">${highlight(item.DNI || '-', q)}</span>
                                        ${item.DNI ? `<button onclick="copiarTexto(event, '${item.DNI}', this)" title="Copiar DNI" class="text-slate-400 hover:text-blue-400 text-[10px] px-1 py-0.5 rounded bg-slate-900 border border-slate-700 cursor-pointer">📋</button>` : ''}
                                    </div>
                                </div>
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800">
                                    <span class="text-slate-400 block text-[9px]">DOMICILIO:</span>
                                    <div class="text-slate-200">${addrs.length ? addrs.map((a, idx) => `${idx ? '<div class="border-t border-slate-800/60 pt-0.5 mt-0.5"></div>' : ''}${formatAddr(a, q)}`).join('') : '<span class="text-slate-500 italic">Sin domicilio</span>'}</div>
                                </div>
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800">
                                    <span class="text-slate-400 block text-[9px]">VEHÍCULOS:</span>
                                    <div class="flex flex-wrap gap-1">${plates.length ? plates.map(p => `<span class="bg-slate-900 px-1 rounded border border-slate-700 font-mono text-blue-300"><span>${esMoto(p) ? '🛵' : '🚗'}</span> ${highlight(p, q)}</span>`).join('') : '<span class="text-slate-500 italic">Ninguno</span>'}</div>
                                </div>
                                ${item.OBSERVACIONES ? `<div class="truncate ${isMuerto ? 'text-red-400 font-bold' : 'text-amber-200'}"><strong>Obs:</strong> ${highlight(item.OBSERVACIONES.replace(/muerto/gi, 'FALLECIDO'), q)}</div>` : ''}
                            </div>
                        </div>

                        <div onclick="selectRecord(${item._id})" class="pt-1 flex justify-end border-t border-slate-800 relative z-10 cursor-pointer">
                            <span class="text-[10px] text-blue-400 font-medium hover:underline">Ver detalle →</span>
                        </div>
                    </div>`;
            }).join('');

            const pagHtml = totalPages > 1 ? `
                <div class="flex items-center justify-center space-x-3 py-3 bg-slate-900/50 rounded-2xl border border-slate-800 my-3 text-xs">
                    <button onclick="changePage(${page - 1})" ${page === 1 ? 'disabled class="opacity-50 cursor-not-allowed px-3 py-1 bg-slate-900"' : 'class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer"'}>← Anterior</button>
                    <span class="text-slate-300 font-mono">Página <strong class="text-blue-400">${page}</strong> de <strong>${totalPages}</strong></span>
                    <button onclick="changePage(${page + 1})" ${page === totalPages ? 'disabled class="opacity-50 cursor-not-allowed px-3 py-1 bg-slate-900"' : 'class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer"'}>Siguiente →</button>
                </div>` : '';
            el('paginationTop').innerHTML = el('paginationBottom').innerHTML = pagHtml;
        }

        function selectRecord(id) {
            lastScroll = document.querySelector('main').scrollTop || window.pageYOffset || 0;
            const item = allData.find(d => d._id === id);
            if (!item) return;
            const plates = [item.PLACA1, item.PLACA2, item.PLACA3, item.PLACA4].filter(Boolean);
            const addrs = [item.DOMICILIO1, item.DOMICILIO2, item.DOMICILIO3].filter(Boolean);
            const isMuerto = item.OBSERVACIONES && /muerto|fallecido/i.test(item.OBSERVACIONES);
            const photo = getPhoto(item.DNI);
            const initials = item.NOMBRE ? (item.NOMBRE.trim().split(" ")[1] ? item.NOMBRE[0] + item.NOMBRE.trim().split(" ")[1][0] : item.NOMBRE.substring(0, 2)).toUpperCase() : "FP";

            el('detailContainer').innerHTML = `
                <div class="bg-slate-900 rounded-2xl border ${isMuerto ? 'border-red-500/80' : 'border-slate-800'} p-3 sm:p-6 shadow-2xl space-y-3 relative overflow-hidden select-text">
                    ${isMuerto ? '<div class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-40"><div class="w-full h-3 bg-red-600 transform rotate-45 absolute"></div><div class="w-full h-3 bg-red-600 transform -rotate-45 absolute"></div></div>' : ''}
                    <div class="flex items-center space-x-3 pb-3 border-b border-slate-800 relative z-10">
                        <div class="w-20 h-24 sm:w-32 sm:h-40 bg-slate-950 border border-slate-700 rounded-xl flex items-center justify-center flex-shrink-0 overflow-hidden relative cursor-pointer group" ${photo ? `onclick="el('imageModal').classList.remove('hidden'); el('imageModal').classList.add('flex'); el('modalImage').src='${photo}'; el('modalTitle').innerText='${item.NOMBRE || 'Registro'}'"` : ''}>
                            <span class="text-blue-400 font-extrabold text-xl sm:text-3xl">${initials}</span>
                            ${photo ? `<img src="${photo}" class="absolute inset-0 w-full h-full object-cover object-top rounded-xl z-10 group-hover:scale-105 transition-transform" onerror="imgError(this, '${item.DNI}')">` : ''}
                            ${photo ? '<div class="absolute bottom-1 right-1 bg-black/60 text-white p-1 rounded text-[9px] z-20 opacity-0 group-hover:opacity-100 transition-opacity">🔍 Ampliar</div>' : ''}
                        </div>
                        <div class="min-w-0 flex-1 space-y-1">
                            <div class="flex flex-wrap gap-1.5 items-center">
                                <span class="px-3 py-1 bg-blue-600 text-white rounded-lg text-sm sm:text-base font-extrabold uppercase tracking-wide">${item.CIUDAD || 'LOCALIDAD'}</span>
                                ${item.MOTE && item.MOTE.toLowerCase() !== 'ninguno' ? `<span class="text-amber-400 font-bold text-xs truncate">${item.MOTE}</span>` : ''}
                            </div>
                            <h2 class="text-base sm:text-xl font-bold text-white leading-tight">${item.NOMBRE || 'SIN NOMBRE'}</h2>
                            <div class="flex justify-between text-[10px] text-slate-400 font-mono pt-1"><span>ID: #${item._id}</span><span class="font-bold text-slate-300">Año: ${item.FECHA || 'S/A'}</span></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-1.5 text-xs relative z-10">
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 flex justify-between items-center">
                            <span class="text-slate-400">DNI / NIE:</span>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-slate-100 font-mono font-bold">${item.DNI || 'No registrado'}</span>
                                ${item.DNI ? `<button onclick="copiarTexto(event, '${item.DNI}', this)" title="Copiar DNI" class="text-slate-400 hover:text-blue-400 text-xs px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 cursor-pointer">📋 Copiar</button>` : ''}
                            </div>
                        </div>
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 space-y-0.5"><span class="text-slate-400 block text-[10px] font-bold uppercase">Domicilios:</span><div class="text-slate-200">${addrs.length ? addrs.map((a, idx) => `${idx ? '<div class="border-t border-slate-800 pt-0.5 mt-0.5"></div>' : ''}${formatAddr(a, '')}`).join('') : '<span class="text-slate-500 italic">Sin domicilio</span>'}</div></div>
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 space-y-1"><span class="text-slate-400 block text-[10px] font-bold uppercase">Vehículos:</span><div class="flex flex-wrap gap-1">${plates.length ? plates.map(p => `<div class="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 font-mono text-blue-300 text-xs"><span>${esMoto(p) ? '🛵' : '🚗'}</span> ${p}</div>`).join('') : '<span class="text-slate-500 italic">Ninguno</span>'}</div></div>
                        ${item.OBSERVACIONES ? `<div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 text-xs ${isMuerto ? 'border-red-500/40 bg-red-950/10' : ''}"><strong class="${isMuerto ? 'text-red-400' : 'text-amber-400'} block text-[10px] uppercase">Observaciones:</strong><span class="${isMuerto ? 'text-red-300 font-semibold' : 'text-slate-300'}">${item.OBSERVACIONES}</span></div>` : ''}
                    </div>
                </div>`;
            switchTab('detail');
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- Modal Imagen -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center p-4 backdrop-blur-sm" onclick="this.classList.remove('flex'); this.classList.add('hidden')">
        <div class="relative max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-2xl flex flex-col items-center space-y-3" onclick="event.stopPropagation()">
            <div class="w-full flex items-center justify-between border-b border-slate-800 pb-2"><span id="modalTitle" class="text-sm font-bold text-white truncate">Fotografía</span><button onclick="el('imageModal').classList.remove('flex'); el('imageModal').classList.add('hidden')" class="px-2.5 py-1 bg-red-600 text-white rounded-lg text-xs font-bold cursor-pointer">✕ Cerrar</button></div>
            <div class="w-full overflow-hidden rounded-xl bg-slate-950 flex items-center justify-center max-h-[75vh]"><img id="modalImage" src="" class="max-h-[75vh] w-auto object-contain rounded-lg"></div>
        </div>
    </div>

    <!-- Pantalla Acceso -->
    <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-950 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6 text-center">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25"><svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
            <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." onkeydown="if(event.key === 'Enter') verificarClave()" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base tracking-widest">
                <button onclick="verificarClave()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg cursor-pointer">Entrar al Sistema</button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- App Principal -->
    <div id="mainApp" style="display: none;" class="h-full flex-col">
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md"><svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></div>
                    <div><h1 class="text-sm sm:text-lg font-bold text-white">CONSULTA BBDD</h1><p class="text-[10px] sm:text-xs text-slate-400">Base de datos unificada</p></div>
                </div>
                <div class="flex items-center space-x-2 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs">
                    <span id="dbStatusDot" class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span id="dbStatusText" class="hidden md:inline text-slate-300">Cargando...</span>
                    <span class="text-slate-300 font-mono">| Registros: <strong id="totalDbCount" class="text-blue-400">0</strong></span>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-6 overflow-y-auto">
            <div id="view-search" class="space-y-4">
                <div class="bg-slate-900 p-3 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-1.5 relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span><input type="text" id="searchInput" oninput="filterData()" placeholder="Nombre, DNI, NIE, Mote, Matrícula..." class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><select id="cityFilter" onchange="filterData()" class="w-full py-3 px-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer"><option value="">Todas las localidades</option></select></div>
                        <div class="flex items-center"><button onclick="el('searchInput').value=''; el('cityFilter').value=''; filterData()" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-sm transition-colors cursor-pointer">Limpiar filtros</button></div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400 px-1"><span id="resultCount">Cargando registros...</span></div>
                </div>

                <div id="paginationTop"></div>
                <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4"></div>
                <div id="paginationBottom"></div>
            </div>

            <div id="view-detail" class="hidden space-y-2 max-w-2xl mx-auto pb-4">
                <div class="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-xl border border-slate-800 sticky top-0 z-20 shadow-md">
                    <button onclick="switchTab('search')" class="text-xs text-blue-400 font-semibold hover:underline cursor-pointer">← Volver al buscador</button>
                    <span class="text-[10px] text-slate-400 font-mono">Ficha de Registro</span>
                </div>
                <div id="detailContainer"></div>
            </div>
        </main>
    </div>
</body>
</html>
