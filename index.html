<ElicitationsGroup message="Aquí tienes el código completo y corregido en un único bloque limpio, con la función de contraseña reforzada y listo para copiar:">
  <ElicitationItem>
    <Text>```html
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA BBDD OPERATIVA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased">

    <!-- ================= PANTALLA DE ACCESO PRINCIPAL ================= -->
    <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-950 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6 text-center my-auto">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
                <p class="text-xs text-slate-400">Introduce la contraseña de acceso principal.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." onkeydown="if(event.key === 'Enter') checkMainPassword()" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base sm:text-sm tracking-widest" autocomplete="current-password">
                <button type="button" onclick="checkMainPassword()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg transition-colors cursor-pointer">
                    Entrar al Sistema
                </button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="mainApp" style="display: none;" class="h-full flex-col">
        <!-- Header / Navbar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">CONSULTA BBDD</h1>
                        <p class="text-xs text-slate-400">Base de datos unificada</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Indicador de Estado y Contador Global -->
                    <div class="hidden sm:flex items-center space-x-3 bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-xs">
                        <div class="flex items-center space-x-2">
                            <span id="dbStatusDot" class="w-3 h-3 rounded-full bg-amber-500 shadow-lg"></span>
                            <span id="dbStatusText" class="text-slate-300 font-medium">Cargando BBDD...</span>
                        </div>
                        <span class="text-slate-600">|</span>
                        <div class="text-slate-300">
                            Registros: <strong id="totalDbCount" class="text-blue-400 font-mono">0</strong>
                        </div>
                    </div>

                    <!-- Pestañas de Navegación -->
                    <nav class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="switchTab('search')" id="tab-search" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer">
                            <span>Buscador</span>
                        </button>
                        <button onclick="switchTab('detail')" id="tab-detail" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer">
                            <span>Desglose Ficha</span>
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">

            <!-- VISTA BUSCADOR -->
            <div id="view-search" class="space-y-6">
                <div class="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <!-- Campo de búsqueda -->
                        <div class="md:col-span-2 relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </span>
                            <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por Nombre, DNI, Mote, Matrícula..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>

                        <!-- Selector de Localidad -->
                        <div>
                            <select id="cityFilter" onchange="filterData()" class="w-full py-2.5 px-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer">
                                <option value="">Todas las localidades</option>
                            </select>
                        </div>

                        <!-- Botón limpiar -->
                        <div class="flex items-center">
                            <button onclick="resetFilters()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-sm transition-colors flex items-center justify-center space-x-2 cursor-pointer">
                                <span>Limpiar filtros</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400">
                        <span id="resultCount">Cargando registros...</span>
                    </div>
                </div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Se inyecta dinámicamente -->
                </div>
            </div>

            <!-- VISTA DESGLOSE DE FICHA -->
            <div id="view-detail" class="hidden space-y-6 max-w-2xl mx-auto">
                <div class="flex items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-md">
                    <button onclick="switchTab('search')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium flex items-center space-x-2 transition-colors cursor-pointer">
                        <span>Volver al Buscador</span>
                    </button>
                </div>

                <div id="detailContainer" class="space-y-4">
                    <!-- Se inyecta dinámicamente -->
                </div>
            </div>

        </main>
    </div>

    <!-- Script de Carga y Gestión del data.json -->
    <script>
        let allData = [];
        let selectedRecordId = null;

        // 1. Cargar el archivo data.json completo al iniciar
        async function loadData() {
            try {
                document.getElementById('resultCount').innerText = "Conectando con el servidor y descargando BBDD...";
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo encontrar el archivo data.json en el repositorio.");
                
                allData = await response.json();
                document.getElementById('totalDbCount').innerText = allData.length;

                // Poblar el desplegable de localidades de forma única
                const localidades = [...new Set(allData.map(item => item.CIUDAD).filter(Boolean))].sort();
                const select = document.getElementById('cityFilter');
                select.innerHTML = '<option value="">Todas las localidades</option>' + 
                    localidades.map(loc => `<option value="${loc}">${loc}</option>`).join('');

                document.getElementById('dbStatusDot').className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50 animate-pulse";
                document.getElementById('dbStatusText').innerText = "Sistema Conectado";
                
                // Pantalla limpia al iniciar
                document.getElementById('resultCount').innerText = "Utiliza el buscador o selecciona una localidad.";
                document.getElementById('resultsGrid').innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
            } catch (error) {
                console.error("Error detallado:", error);
                document.getElementById('dbStatusDot').className = "w-3 h-3 rounded-full bg-red-500 shadow-lg";
                document.getElementById('dbStatusText').innerText = "Error de Carga";
                document.getElementById('resultCount').innerText = "Error: Asegúrate de que 'data.json' está subido en la misma ruta que el index.html.";
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);

        function checkMainPassword() {
            const input = document.getElementById('passwordInput');
            const authError = document.getElementById('authError');
            
            if (!input) return;
            const pass = input.value.trim();

            if (pass === "udyco") {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
            } else {
                if (authError) authError.classList.remove('hidden');
            }
        }

        function getInitials(name) {
            if (!name) return "FP";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function getPhotoUrl(item) {
            if (item.DNI && item.DNI.trim() !== '') {
                return `fotos/${item.DNI.trim().toUpperCase()}.jpg`;
            }
            return null;
        }

        function switchTab(tabName) {
            const searchView = document.getElementById('view-search');
            const detailView = document.getElementById('view-detail');
            const tabSearch = document.getElementById('tab-search');
            const tabDetail = document.getElementById('tab-detail');

            if (tabName === 'search') {
                searchView.classList.remove('hidden');
                detailView.classList.add('hidden');
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer";
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer";
            } else {
                if (!selectedRecordId) return;
                searchView.classList.add('hidden');
                detailView.classList.remove('hidden');
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer";
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer";
                renderDetail(selectedRecordId);
            }
        }

        // 2. Filtrar datos en tiempo real
        function filterData() {
            const queryInput = document.getElementById('searchInput');
            const cityFilter = document.getElementById('cityFilter');
            const grid = document.getElementById('resultsGrid');
            const resultCount = document.getElementById('resultCount');

            if (!queryInput || !grid) return;

            const query = queryInput.value.toLowerCase().trim();
            const selectedCity = cityFilter ? cityFilter.value : '';

            // Si no hay texto de búsqueda ni localidad seleccionada, mantiene la pantalla limpia
            if (query === '' && !selectedCity) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
                resultCount.innerText = "Esperando búsqueda...";
                return;
            }

            const filtered = allData.filter(item => {
                if (selectedCity && item.CIUDAD !== selectedCity) return false;
                if (query === '') return true;
                return Object.values(item).some(val => String(val).toLowerCase().includes(query));
            });

            const maxDisplayLimit = 40;
            const limitedFiltered = filtered.slice(0, maxDisplayLimit);

            if (filtered.length > maxDisplayLimit) {
                resultCount.innerText = `Mostrando los primeros ${maxDisplayLimit} de ${filtered.length} coincidentes`;
            } else {
                resultCount.innerText = `Mostrando ${filtered.length} registros coincidentes`;
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800">No se encontraron registros coincidentes.</div>`;
                return;
            }

            grid.innerHTML = limitedFiltered.map(item => {
                const initials = getInitials(item.NOMBRE);
                const plates = [];
                if (item.PLACA1) plates.push(item.PLACA1);
                if (item.PLACA2) plates.push(item.PLACA2);
                if (item.PLACA3) plates.push(item.PLACA3);
                if (item.PLACA4) plates.push(item.PLACA4);

                const photoUrl = getPhotoUrl(item);

                return `
                    <div class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-5 shadow-xl flex flex-col justify-between group transition-all space-y-4">
                        <div class="cursor-pointer space-y-4" onclick="selectRecord(${item.id})">
                            <div class="flex items-center space-x-4 pb-4 border-b border-slate-800">
                                <div class="w-36 h-36 bg-slate-950 border-2 border-slate-700/80 rounded-2xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden group-hover:border-blue-500/80 transition-colors relative">
                                    <span class="text-blue-400 font-extrabold text-3xl tracking-wider">${initials}</span>
                                    ${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover rounded-xl" onerror="this.style.display='none'">` : ''}
                                </div>
                                <div class="min-w-0 flex-1 space-y-1.5">
                                    <span class="px-2.5 py-1 bg-blue-500/10 text-blue-400 rounded-lg text-[10px] font-bold uppercase tracking-wider border border-blue-500/20 inline-block">
                                        ${item.CIUDAD || 'LOCALIDAD'}
                                    </span>
                                    <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-blue-400 transition-colors leading-snug">${item.NOMBRE || 'SIN NOMBRE'}</h3>
                                </div>
                            </div>

                            <div class="space-y-2 text-xs">
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">DNI:</span>
                                    <span class="text-slate-100 font-mono font-semibold">${item.DNI || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">ALIAS / MOTE:</span>
                                    <span class="text-amber-400 font-semibold">${item.MOTE || 'Ninguno'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">AÑO:</span>
                                    <span class="text-slate-100 font-mono">${item.FECHA || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1">
                                    <span class="text-slate-400 font-medium block">DOMICILIO:</span>
                                    <span class="text-slate-200 block">${item.DOMICILIO1 || 'Sin domicilio'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1.5">
                                    <span class="text-slate-400 font-medium block">VEHÍCULOS / PLACAS:</span>
                                    <div class="flex flex-wrap gap-1.5 pt-0.5">
                                        ${plates.length > 0 ? plates.map(p => `
                                            <span class="bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700 text-[11px] font-mono text-blue-300 flex items-center space-x-1">
                                                <span>🚗</span>
                                                <span>${p}</span>
                                            </span>
                                        `).join('') : '<span class="text-slate-500 italic">Ningún vehículo registrado</span>'}
                                    </div>
                                </div>
                                ${item.OBSERVACIONES ? `
                                    <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1">
                                        <span class="text-slate-400 font-medium block">OBSERVACIONES:</span>
                                        <span class="text-slate-300 block">${item.OBSERVACIONES}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="pt-3 flex items-center justify-end border-t border-slate-800">
                            <button onclick="selectRecord(${item.id})" class="text-xs text-blue-400 font-medium hover:underline flex items-center space-x-1 cursor-pointer">
                                <span>Ver desglose completo</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = '';
            filterData();
        }

        function selectRecord(id) {
            selectedRecordId = id;
            switchTab('detail');
        }

        function renderDetail(id) {
            const item = allData.find(d => d.id === id);
            const container = document.getElementById('detailContainer');
            if (!item || !container) return;

            const initials = getInitials(item.NOMBRE);
            const plates = [];
            if (item.PLACA1) plates.push(item.PLACA1);
            if (item.PLACA2) plates.push(item.PLACA2);
            if (item.PLACA3) plates.push(item.PLACA3);
            if (item.PLACA4) plates.push(item.PLACA4);

            const photoUrl = getPhotoUrl(item);

            container.innerHTML = `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 sm:p-8 shadow-2xl space-y-6">
                    <div class="flex items-center space-x-5 pb-6 border-b border-slate-800">
                        <div class="w-40 h-40 bg-slate-950 border-2 border-slate-700 rounded-2xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden relative">
                            <span class="text-blue-400 font-black text-4xl tracking-wider">${initials}</span>
                            ${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover rounded-2xl" onerror="this.style.display='none'">` : ''}
                        </div>
                        <div class="space-y-2">
                            <span class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider inline-block">
                                ${item.CIUDAD || 'LOCALIDAD'}
                            </span>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight leading-snug">${item.NOMBRE}</h2>
                            <p class="text-xs text-slate-400 font-mono">Registro ID: #${item.id}</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">DNI:</span>
                            <span class="text-slate-100 font-mono font-semibold">${item.DNI || 'No registrado'}</span>
                        </div>

                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">ALIAS / MOTE:</span>
                            <span class="text-amber-400 font-bold">${item.MOTE || 'Ninguno'}</span>
                        </div>

                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">AÑO:</span>
                            <span class="text-slate-100 font-mono">${item.FECHA || 'No especificado'}</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">DOMICILIOS:</span>
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200">
                            <span>📍</span>
                            <span>${item.DOMICILIO1 || 'No registrado'}</span>
                        </div>
                        ${item.DOMICILIO2 ? `<div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200"><span>📍</span><span>${item.DOMICILIO2}</span></div>` : ''}
                        ${item.DOMICILIO3 ? `<div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200"><span>📍</span><span>${item.DOMICILIO3}</span></div>` : ''}
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">VEHÍCULOS / PLACAS:</span>
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${plates.length > 0 ? plates.map(p => `
                                <div class="bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-xs font-mono text-slate-200 flex items-center space-x-2">
                                    <span>🚗</span>
                                    <span>${p}</span>
                                </div>
                            `).join('') : '<span class="text-xs text-slate-500 italic">Ningún vehículo registrado</span>'}
                        </div>
                        ${item.OBSERVACIONES ? `
                            <div class="mt-2 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-xs text-slate-300">
                                <strong class="text-slate-400 block mb-1">Observaciones / Naves:</strong>
                                ${item.OBSERVACIONES}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
```</Text>
