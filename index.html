<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA BBDD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased">

    <!-- ================= PANTALLA DE ACCESO PRINCIPAL (udyco) ================= -->
    <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-950 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-8 space-y-6 text-center">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
                <p class="text-xs text-slate-400">Introduce la contraseña de acceso principal.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." onkeydown="if(event.key === 'Enter') window.checkMainPassword()" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm tracking-widest" autocomplete="current-password">
                <button type="button" onclick="window.checkMainPassword()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg transition-colors cursor-pointer">
                    Entrar al Sistema
                </button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="mainApp" style="display: none;" class="h-full flex-col">
        <!-- Header / Navbar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">CONSULTA BBDD</h1>
                        <p class="text-xs text-slate-400">Sistema de consulta operativa</p>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Pestañas de Navegación -->
                    <nav class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="window.switchTab('search')" id="tab-search" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer">
                            <span>Buscador</span>
                        </button>
                        <button onclick="window.switchTab('detail')" id="tab-detail" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer">
                            <span>Desglose Ficha</span>
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">

            <!-- VISTA BUSCADOR -->
            <div id="view-search" class="space-y-6">
                <div class="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <!-- Campo de búsqueda -->
                        <div class="md:col-span-2 relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400
