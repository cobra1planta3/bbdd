<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONSULTA BBDD OPERATIVA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- Script principal cargado en el head -->
    <script>
        let allData = [];
        let selectedRecordId = null;
        let currentPage = 1;
        const itemsPerPage = 24;

        function verificarClave() {
            const input = document.getElementById('passwordInput');
            const authError = document.getElementById('authError');
            
            if (!input) return;
            const pass = input.value.trim().toLowerCase();

            if (pass === "udyco") {
                if (authError) authError.classList.add('hidden');
                input.blur();
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                window.scrollTo(0, 0);
                loadData();
            } else {
                if (authError) authError.classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                const resultCount = document.getElementById('resultCount');
                if (resultCount) resultCount.innerText = "Conectando con el servidor...";
                
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo encontrar el archivo data.json.");
                
                allData = await response.json();
                document.getElementById('totalDbCount').innerText = allData.length;

                const localidades = [...new Set(allData.map(item => item.CIUDAD).filter(Boolean))].sort();
                const citySelect = document.getElementById('cityFilter');
                if (citySelect) {
                    citySelect.innerHTML = '<option value="">Todas las localidades</option>' + 
                        localidades.map(loc => `<option value="${loc}">${loc}</option>`).join('');
                }

                document.getElementById('dbStatusDot').className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50 animate-pulse";
                document.getElementById('dbStatusText').innerText = "Conectado";
                if (resultCount) resultCount.innerText = "Escribe para buscar registros.";
                document.getElementById('resultsGrid').innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
            } catch (error) {
                console.error("Error al cargar data.json:", error);
                document.getElementById('dbStatusDot').className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-red-500 shadow-lg";
                document.getElementById('dbStatusText').innerText = "Sin conexión a BBDD";
                const resultCount = document.getElementById('resultCount');
                if (resultCount) resultCount.innerText = "Aviso: No se encuentra o no se puede leer el archivo data.json.";
                document.getElementById('resultsGrid').innerHTML = `<div class="col-span-full py-12 text-center text-amber-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">El sistema ha abierto la interfaz, pero el archivo 'data.json' no responde. Revisa que esté en la misma carpeta que este archivo HTML.</div>`;
            }
        }

        function getInitials(name) {
            if (!name) return "FP";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function getPhotoUrl(item) {
            if (item.DNI && item.DNI.trim() !== '') {
                const cleanDni = item.DNI.trim().replace(/\s+/g, '');
                return `fotos/${cleanDni}.jpg`; } return null; }  // Control estricto de errores sin bucles de peticiones function handleImageError(imgElement, dni) { if (!imgElement.dataset.retried) { imgElement.dataset.retried = "true"; const cleanDni = dni.trim().replace(/\s+/g, ''); // Un solo intento controlado pasando a minúsculas imgElement.src = `fotos/${cleanDni.toLowerCase()}.jpg`;
            } else {
                imgElement.remove();
            }
        }

        function switchTab(tabName) {
            const searchView = document.getElementById('view-search');
            const detailView = document.getElementById('view-detail');

            if (tabName === 'search') {
                searchView.classList.remove('hidden');
                detailView.classList.add('hidden');
            } else {
                if (!selectedRecordId) return;
                searchView.classList.add('hidden');
                detailView.classList.remove('hidden');
                renderDetail(selectedRecordId);
            }
        }

        function filterData(resetPage = true) {
            if (resetPage) currentPage = 1;

            const queryInput = document.getElementById('searchInput');
            const cityFilter = document.getElementById('cityFilter');
            const grid = document.getElementById('resultsGrid');
            const resultCount = document.getElementById('resultCount');
            const paginationContainer = document.getElementById('paginationContainer');

            if (!queryInput || !grid) return;

            const query = queryInput.value.toLowerCase().trim();
            const selectedCity = cityFilter ? cityFilter.value : '';

            if (query === '' && !selectedCity) {
                grid.innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
                resultCount.innerText = "Esperando búsqueda...";
                if (paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            const filtered = allData.filter(item => {
                if (selectedCity && item.CIUDAD !== selectedCity) return false;
                if (query === '') return true;
                return Object.values(item).some(val => String(val).toLowerCase().includes(query));
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, endIndex);

            resultCount.innerText = `Mostrando registros del ${filtered.length > 0 ? startIndex + 1 : 0} al ${Math.min(endIndex, filtered.length)} de${filtered.length} coincidentes`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 sm:py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">No se encontraron registros coincidentes.</div>`;
                if (paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            grid.innerHTML = paginatedItems.map(item => {
                const initials = getInitials(item.NOMBRE);
                const plates = [];
                if (item.PLACA1) plates.push(item.PLACA1);
                if (item.PLACA2) plates.push(item.PLACA2);
                if (item.PLACA3) plates.push(item.PLACA3);
                if (item.PLACA4) plates.push(item.PLACA4);

                const photoUrl = getPhotoUrl(item);

                return `
                    <div class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-3.5 sm:p-4 shadow-xl flex flex-col justify-between group transition-all space-y-3">
                        <div class="cursor-pointer space-y-3" onclick="selectRecord(${item.id})">
                            <div class="flex items-center space-x-3 pb-3 border-b border-slate-800">
                                <div class="w-24 h-28 sm:w-28 sm:h-32 bg-slate-950 border-2 border-slate-700/80 rounded-xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden group-hover:border-blue-500/80 transition-colors relative">
                                    <span class="text-blue-400 font-extrabold text-xl sm:text-2xl tracking-wider">${initials}</span>${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover object-top rounded-xl z-10" onerror="handleImageError(this, '${item.DNI}');">` : ''}
                                </div>
                                <div class="min-w-0 flex-1 space-y-1">
                                    <span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded-md text-[9px] font-bold uppercase tracking-wider border border-blue-500/20 inline-block">
                                        ${item.CIUDAD || 'LOCALIDAD'}
                                    </span>
                                    <h3 class="text-xs sm:text-sm font-bold text-white group-hover:text-blue-400 transition-colors leading-tight line-clamp-2">${item.NOMBRE || 'SIN NOMBRE'}</h3>
                                </div>
                            </div>

                            <div class="space-y-1.5 text-xs">
                                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400">DNI:</span>
                                    <span class="text-slate-100 font-mono font-semibold">${item.DNI || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400">ALIAS:</span>
                                    <span class="text-amber-400 font-semibold truncate max-w-[120px]">${item.MOTE || 'Ninguno'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400">AÑO:</span>
                                    <span class="text-slate-100 font-mono">${item.FECHA || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 space-y-0.5">
                                    <span class="text-slate-400 block text-[11px]">DOMICILIO:</span>
                                    <span class="text-slate-200 block truncate">${item.DOMICILIO1 || 'Sin domicilio'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 space-y-1">
                                    <span class="text-slate-400 block text-[11px]">VEHÍCULOS:</span>
                                    <div class="flex flex-wrap gap-1">
                                        ${plates.length > 0 ? plates.map(p => `
                                            <span class="bg-slate-900 px-1.5 py-0.5 rounded-lg border border-slate-700 text-[9px] font-mono text-blue-300 flex items-center space-x-1">
                                                <span>🚗</span>
                                                <span>${p}</span>
                                            </span>
                                        `).join('') : '<span class="text-slate-500 italic text-[11px]">Ninguno</span>'}
                                    </div>
                                </div>
                                ${item.OBSERVACIONES ? `
                                    <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 space-y-0.5">
                                        <span class="text-slate-400 block text-[11px]">OBSERVACIONES:</span>
                                        <span class="text-slate-300 block line-clamp-2">${item.OBSERVACIONES}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="pt-2 flex items-center justify-end border-t border-slate-800">
                            <button type="button" onclick="selectRecord(${item.id})" class="text-xs text-blue-400 font-medium hover:underline flex items-center space-x-1 cursor-pointer py-1">
                                <span>Ver desglose completo →</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if (!container) return;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <div class="flex items-center justify-center space-x-3 py-6">
                    <button type="button" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-4 py-2 bg-slate-900 text-slate-600 border border-slate-800 rounded-xl cursor-not-allowed text-sm font-medium"' : 'class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl cursor-pointer text-sm font-medium transition-colors"'}>
                        ← Anterior
                    </button>
                    <span class="text-xs sm:text-sm text-slate-300 font-mono px-3">
                        Página <strong class="text-blue-400">${currentPage}</strong> de <strong class="text-slate-100">${totalPages}</strong>
                    </span>
                    <button type="button" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-4 py-2 bg-slate-900 text-slate-600 border border-slate-800 rounded-xl cursor-not-allowed text-sm font-medium"' : 'class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl cursor-pointer text-sm font-medium transition-colors"'}>
                        Siguiente →
                    </button>
                </div>
            `;
        }

        function changePage(targetPage) {
            currentPage = targetPage;
            filterData(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = '';
            filterData(true);
        }

        function selectRecord(id) {
            selectedRecordId = id;
            switchTab('detail');
        }

        function renderDetail(id) {
            const item = allData.find(d => d.id === id);
            const container = document.getElementById('detailContainer');
            if (!item || !container) return;

            const initials = getInitials(item.NOMBRE);
            const plates = [];
            if (item.PLACA1) plates.push(item.PLACA1);
            if (item.PLACA2) plates.push(item.PLACA2);
            if (item.PLACA3) plates.push(item.PLACA3);
            if (item.PLACA4) plates.push(item.PLACA4);

            const photoUrl = getPhotoUrl(item);

            container.innerHTML = `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-8 shadow-2xl space-y-5">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-5 pb-5 border-b border-slate-800 text-center sm:text-left">
                        <div class="w-40 h-48 sm:w-44 sm:h-52 bg-slate-950 border-2 border-slate-700 rounded-2xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden relative">
                            <span class="text-blue-400 font-black text-4xl tracking-wider">${initials}</span>${photoUrl ? `<img src="${photoUrl}" alt="${item.NOMBRE}" class="absolute inset-0 w-full h-full object-cover object-top rounded-2xl z-10" onerror="handleImageError(this, '${item.DNI}');">` : ''}
                        </div>
                        <div class="space-y-2">
                            <span class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider inline-block">
                                ${item.CIUDAD || 'LOCALIDAD'}
                            </span>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight leading-snug">${item.NOMBRE}</h2>
                            <p class="text-xs text-slate-400 font-mono">Registro ID: #${item.id}</p>
                        </div>
                    </div>

                    <div class="space-y-2.5 text-sm">
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                            <span class="text-slate-400">DNI:</span>
                            <span class="text-slate-100 font-mono font-semibold">${item.DNI || 'No registrado'}</span>
                        </div>
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                            <span class="text-slate-400">ALIAS / MOTE:</span>
                            <span class="text-amber-400 font-bold">${item.MOTE || 'Ninguno'}</span>
                        </div>
                        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                            <span class="text-slate-400">
