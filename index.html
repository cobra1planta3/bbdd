<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA BBDD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased">

    <!-- ================= PANTALLA DE ACCESO PRINCIPAL (cobra) ================= -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-8 space-y-6 text-center">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25">
                <i data-lucide="search" class="w-10 h-10"></i>
            </div>
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
                <p class="text-xs text-slate-400">Introduce la contraseña de acceso principal.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." onkeydown="if(event.key === 'Enter') checkMainPassword()" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm tracking-widest" autocomplete="current-password">
                <button type="button" onclick="checkMainPassword()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg transition-colors cursor-pointer">
                    Entrar al Sistema
                </button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="mainApp" class="hidden h-full flex-col">
        <!-- Header / Navbar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                        <i data-lucide="database" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">CONSULTA BBDD</h1>
                        <p class="text-xs text-slate-400">Sistema de consulta operativa</p>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Pestañas de Navegación -->
                    <nav class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="switchTab('search')" id="tab-search" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer">
                            <i data-lucide="search" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">Buscador</span>
                        </button>
                        <button onclick="switchTab('detail')" id="tab-detail" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer">
                            <i data-lucide="user" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">Desglose Ficha</span>
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">

            <!-- VISTA BUSCADOR -->
            <div id="view-search" class="space-y-6">
                <div class="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <!-- Campo de búsqueda -->
                        <div class="md:col-span-2 relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="search" class="w-5 h-5"></i>
                            </span>
                            <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por Nombre, DNI, Mote, Teléfono, Vehículo..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>

                        <!-- Filtro por Ciudad -->
                        <div>
                            <select id="cityFilter" onchange="filterData()" class="w-full py-2.5 px-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer">
                                <option value="">Todas las ciudades</option>
                                <option value="MEDINA">Medina</option>
                                <option value="CONIL">Conil</option>
                            </select>
                        </div>

                        <!-- Botón limpiar -->
                        <div class="flex items-center">
                            <button onclick="resetFilters()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-sm transition-colors flex items-center justify-center space-x-2 cursor-pointer">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                <span>Limpiar filtros</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400">
                        <span id="resultCount">Introduce un criterio de búsqueda o selecciona una ciudad</span>
                        <span class="italic">Los resultados aparecerán aquí al filtrar</span>
                    </div>
                </div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Se inyecta dinámicamente según filtros -->
                </div>
            </div>

            <!-- VISTA DESGLOSE DE FICHA -->
            <div id="view-detail" class="hidden space-y-6 max-w-2xl mx-auto">
                <div class="flex items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-md">
                    <button onclick="switchTab('search')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium flex items-center space-x-2 transition-colors cursor-pointer">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>Volver al Buscador</span>
                    </button>
                </div>

                <div id="detailContainer" class="space-y-4">
                    <!-- Se inyecta dinámicamente -->
                </div>
            </div>

        </main>
    </div>

    <!-- Script de Lógica -->
    <script>
        // Inicializar iconos de Lucide al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });

        let dataset = [
            { id: 1, CIUDAD: "MEDINA", NOMBRE: "VICTOR ARIZA MARCHANTE", DNI: "76089910E", MOTE: "Bombita", FECHA: 1990, DOMICILIO1: "C/ Sierra Blanquilla 12, 1A Medina", PLACA: "4515JZZ TMAX / 2150CZF LEON / CA7808BL GOLF", OBSERVACIONES: "Nave calle Grecia 2" },
            { id: 2, CIUDAD: "MEDINA", NOMBRE: "JORGE MENA BENITEZ", DNI: "20073884J", MOTE: "", FECHA: 1997, DOMICILIO1: "C/ Resbala 15 Medina", PLACA: "1701CKL", OBSERVACIONES: "Peugeot 206 / Primo araña" },
            { id: 3, CIUDAD: "MEDINA", NOMBRE: "JOSE LUIS GUTIERREZ MACIAS", DNI: "15443964Q", MOTE: "Palmera", FECHA: 1996, DOMICILIO1: "Ntra. Señora de la Paz, 9, 3A Medina", PLACA: "0467FYR W", OBSERVACIONES: "Polo / Laura Díaz Benítez" },
            { id: 4, CIUDAD: "MEDINA", NOMBRE: "ALEJANDRO ASTORGA GAMAZA", DNI: "15441148Y", MOTE: "", FECHA: 1989, DOMICILIO1: "C/ Fenicios 19 Medina", PLACA: "7525MRR Honda Adv350 / 3531JJV BMW", OBSERVACIONES: "Nave c/ Alemania 2 / Rosa Mª García Alvarado" },
            { id: 5, CIUDAD: "MEDINA", NOMBRE: "MANUEL MENDOZA MOTA", DNI: "52303336W", MOTE: "Lili", FECHA: 1966, DOMICILIO1: "C/ Olivo 5 Medina", PLACA: "", OBSERVACIONES: "Menudeo coca Medina" },
            { id: 6, CIUDAD: "MEDINA", NOMBRE: "LUIS FERNANDEZ FERNANDEZ", DNI: "15444240Q", MOTE: "", FECHA: 1990, DOMICILIO1: "C/ Manuel de falla 8 Medina", PLACA: "9628DDK BMW / 7353FPN BMW 318", OBSERVACIONES: "Cuñado Bombita / Mª Carmen Ariza Marchante" },
            { id: 7, CIUDAD: "MEDINA", NOMBRE: "CARLOS DE LA FLOR MORENO", DNI: "20073139G", MOTE: "", FECHA: 2004, DOMICILIO1: "Juan XXIII, 2, Bq 3, Esc 2, 3B Medina", PLACA: "SA7184B Seat Leon Gris", OBSERVACIONES: "Nave bombita" },
            { id: 8, CIUDAD: "MEDINA", NOMBRE: "CRISTIAN FERNANDEZ CASTILLO", DNI: "", MOTE: "Pilita", FECHA: "", DOMICILIO1: "", PLACA: "", OBSERVACIONES: "" },
            { id: 9, CIUDAD: "MEDINA", NOMBRE: "ALBERTO CARAVACA CASTRO", DNI: "", MOTE: "FUTBOLISTA", FECHA: 1990, DOMICILIO1: "C/ Rodan Greco 27 Medina / C/ Antártida 47, PTA 7 Medina", PLACA: "4832JCZ W Golf", OBSERVACIONES: "Minerva Salas Jiménez" },
            { id: 10, CIUDAD: "MEDINA", NOMBRE: "JERONIMO CANTERO MACIAS", DNI: "31241315R", MOTE: "", FECHA: 1963, DOMICILIO1: "C/ Tartessos 68, bj Medina", PLACA: "", OBSERVACIONES: "Con Jonatan Rosa en barco en Algeciras" }
        ];

        let selectedRecordId = null;

        function checkMainPassword() {
            const pass = document.getElementById('passwordInput').value.trim();
            if (pass === "cobra") {
                document.getElementById('authScreen').style.display = 'none';
                const mainApp = document.getElementById('mainApp');
                mainApp.classList.remove('hidden');
                mainApp.style.display = 'flex';
                filterData();
                lucide.createIcons();
            } else {
                const err = document.getElementById('authError');
                err.classList.remove('hidden');
            }
        }

        function getInitials(name) {
            if (!name) return "FP";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function switchTab(tabName) {
            const searchView = document.getElementById('view-search');
            const detailView = document.getElementById('view-detail');
            const tabSearch = document.getElementById('tab-search');
            const tabDetail = document.getElementById('tab-detail');

            if (tabName === 'search') {
                searchView.classList.remove('hidden');
                detailView.classList.add('hidden');
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer";
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer";
            } else {
                if (!selectedRecordId) return;
                searchView.classList.add('hidden');
                detailView.classList.remove('hidden');
                tabDetail.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition-all flex items-center space-x-1.5 shadow cursor-pointer";
                tabSearch.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all flex items-center space-x-1.5 cursor-pointer";
                renderDetail(selectedRecordId);
            }
            lucide.createIcons();
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const city = document.getElementById('cityFilter').value;
            const grid = document.getElementById('resultsGrid');

            if (query === '' && city === '') {
                document.getElementById('resultCount').innerText = "Introduce un criterio de búsqueda o selecciona una ciudad";
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800/80 italic">Realiza una búsqueda o selecciona una ciudad para mostrar las fichas completas.</div>`;
                return;
            }

            const filtered = dataset.filter(item => {
                const matchesCity = city === '' || item.CIUDAD === city;
                const matchesQuery = query === '' || Object.values(item).some(val => String(val).toLowerCase().includes(query));
                return matchesCity && matchesQuery;
            });

            document.getElementById('resultCount').innerText = `Mostrando ${filtered.length} fichas`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800">No se encontraron registros coincidentes.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const initials = getInitials(item.NOMBRE);
                const plates = item.PLACA ? item.PLACA.split('/').map(p => p.trim()).filter(Boolean) : [];
                return `
                    <div class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-5 shadow-xl flex flex-col justify-between group transition-all space-y-4">
                        <div class="cursor-pointer space-y-4" onclick="selectRecord(${item.id})">
                            <!-- Cabecera Tarjeta -->
                            <div class="flex items-center space-x-4 pb-3 border-b border-slate-800">
                                <div class="w-14 h-14 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-center text-blue-400 font-bold text-lg shadow-inner flex-shrink-0">
                                    ${initials}
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded-md text-[10px] font-bold uppercase tracking-wider border border-blue-500/20">
                                        ${item.CIUDAD || 'CONIL'}
                                    </span>
                                    <h3 class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors truncate mt-1">${item.NOMBRE || 'SIN NOMBRE'}</h3>
                                </div>
                            </div>

                            <!-- Ficha Completa Desglosada -->
                            <div class="space-y-2 text-xs">
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">DNI:</span>
                                    <span class="text-slate-100 font-mono">${item.DNI || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">ALIAS / MOTE:</span>
                                    <span class="text-amber-400 font-semibold">${item.MOTE || 'Ninguno'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex justify-between items-center">
                                    <span class="text-slate-400 font-medium">AÑO:</span>
                                    <span class="text-slate-100 font-mono">${item.FECHA || '-'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1">
                                    <span class="text-slate-400 font-medium block">DOMICILIO:</span>
                                    <span class="text-slate-200 block">${item.DOMICILIO1 || 'Sin domicilio'}</span>
                                </div>
                                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1.5">
                                    <span class="text-slate-400 font-medium block">VEHÍCULOS / ENLACES VISIBLES:</span>
                                    <div class="flex flex-wrap gap-1.5 pt-0.5">
                                        ${plates.length > 0 ? plates.map(p => `
                                            <span class="bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700 text-[11px] font-mono text-blue-300 flex items-center space-x-1">
                                                <i data-lucide="car" class="w-3 h-3 text-blue-400"></i>
                                                <span>${p}</span>
                                            </span>
                                        `).join('') : '<span class="text-slate-500 italic">Ningún vehículo registrado</span>'}
                                    </div>
                                </div>
                                ${item.OBSERVACIONES ? `
                                    <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1">
                                        <span class="text-slate-400 font-medium block">OBSERVACIONES:</span>
                                        <span class="text-slate-300 block">${item.OBSERVACIONES}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Botón Ver Detalle -->
                        <div class="pt-3 flex items-center justify-end border-t border-slate-800">
                            <button onclick="selectRecord(${item.id})" class="text-xs text-blue-400 font-medium hover:underline flex items-center space-x-1 cursor-pointer">
                                <span>Ver desglose completo</span>
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = '';
            filterData();
        }

        function selectRecord(id) {
            selectedRecordId = id;
            switchTab('detail');
        }

        function renderDetail(id) {
            const item = dataset.find(d => d.id === id);
            const container = document.getElementById('detailContainer');
            if (!item) return;

            const initials = getInitials(item.NOMBRE);
            const plates = item.PLACA ? item.PLACA.split('/').map(p => p.trim()).filter(Boolean) : [];

            container.innerHTML = `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 sm:p-8 shadow-2xl space-y-6">
                    <div class="flex items-center space-x-5 pb-6 border-b border-slate-800">
                        <div class="w-20 h-20 bg-slate-950 border border-slate-700 rounded-2xl flex items-center justify-center text-blue-400 font-extrabold text-2xl shadow-inner flex-shrink-0">
                            ${initials}
                        </div>
                        <div class="space-y-1.5">
                            <span class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider">
                                ${item.CIUDAD || 'CONIL'}
                            </span>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">${item.NOMBRE}</h2>
                            <p class="text-xs text-slate-400 font-mono">Registro ID: #${item.id}</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">DNI:</span>
                            <span class="text-slate-100 font-mono font-semibold">${item.DNI || 'No registrado'}</span>
                        </div>

                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">ALIAS / MOTE:</span>
                            <span class="text-amber-400 font-bold">${item.MOTE || 'Ninguno'}</span>
                        </div>

                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-sm">
                            <span class="text-slate-400 font-medium">AÑO:</span>
                            <span class="text-slate-100 font-mono">${item.FECHA || 'No especificado'}</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">DOMICILIOS:</span>
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-sm flex items-center space-x-2 text-slate-200">
                            <i data-lucide="map-pin" class="w-4 h-4 text-blue-500 flex-shrink-0"></i>
                            <span>${item.DOMICILIO1 || 'Sin domicilio registrado'}</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">VEHÍCULOS / ENLACES VISIBLES:</span>
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${plates.length > 0 ? plates.map(p => `
                                <div class="bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-xs font-mono text-slate-200 flex items-center space-x-2">
                                    <i data-lucide="car" class="w-3.5 h-3.5 text-blue-400"></i>
                                    <span>${p}</span>
                                </div>
                            `).join('') : '<span class="text-xs text-slate-500 italic">Ningún vehículo registrado</span>'}
                        </div>
                        ${item.OBSERVACIONES ? `
                            <div class="mt-2 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 text-xs text-slate-300">
                                <strong class="text-slate-400 block mb-1">Observaciones / Naves:</strong>
                                ${item.OBSERVACIONES}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
