<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONSULTA BBDD OPERATIVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } } }
    </script>
    <style>
        mark { background-color: #facc15; color: #020617; padding: 0 2px; border-radius: 3px; font-weight: bold; }
    </style>
    <script>
        let allData = [], currentPage = 1, lastScrollPosition = 0;
        const ITEMS_PER_PAGE = 40;

        const el = (id) => document.getElementById(id);

        function verificarClave() {
            const input = el('passwordInput');
            if (!input) return;
            if (input.value.trim().toLowerCase() === "udyco") {
                el('authError')?.classList.add('hidden');
                input.blur();
                el('authScreen').style.display = 'none';
                el('mainApp').style.display = 'flex';
                window.scrollTo(0, 0);
                loadData();
            } else {
                el('authError')?.classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                if (el('resultCount')) el('resultCount').innerText = "Conectando con el servidor...";
                const res = await fetch('data.json?t=' + Date.now());
                if (!res.ok) throw new Error();
                
                allData = (await res.json()).map((item, index) => ({ ...item, _internalId: index }));
                el('totalDbCount').innerText = allData.length;

                const localidades = [...new Set(allData.map(i => i.CIUDAD).filter(Boolean))].sort();
                if (el('cityFilter')) {
                    el('cityFilter').innerHTML = '<option value="">Todas las localidades</option>' + localidades.map(l => `<option value="${l}">${l}</option>`).join('');
                }

                el('dbStatusDot').className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50 animate-pulse";
                el('dbStatusText').innerText = "Conectado";
                if (el('resultCount')) el('resultCount').innerText = "Escribe para buscar registros.";
                el('resultsGrid').innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
            } catch {
                el('dbStatusDot').className = "w-3 h-3 rounded-full bg-red-500 shadow-lg";
                el('dbStatusText').innerText = "Sin conexión";
                if (el('resultCount')) el('resultCount').innerText = "Aviso: No se encuentra data.json.";
                el('resultsGrid').innerHTML = `<div class="col-span-full py-12 text-center text-amber-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Revisa que 'data.json' esté en la misma carpeta.</div>`;
            }
        }

        const getInitials = (name) => name ? (name.trim().split(" ").length >= 2 ? name.trim().split(" ")[0][0] + name.trim().split(" ")[1][0] : name.substring(0, 2)).toUpperCase() : "FP";
        const cleanDoc = (doc) => doc ? doc.trim().replace(/[^a-zA-Z0-9]/g, '') : '';
        const getPhotoUrl = (dni) => cleanDoc(dni) ? `fotos/${cleanDoc(dni).toUpperCase()}.jpg` : null;

        function handleImageError(img, dni) {
            const step = parseInt(img.dataset.step || '0', 10), doc = cleanDoc(dni);
            if (step === 0 && doc) { img.dataset.step = '1'; img.src = `fotos/${doc.toLowerCase()}.jpg`; }
            else if (step === 1 && doc) { img.dataset.step = '2'; img.src = `fotos/${doc}.jpeg`; }
            else img.remove();
        }

        const normalizeText = (text) => text ? text.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase() : "";

        function highlightText(text, query) {
            if (!text) return '-';
            const str = String(text);
            if (!query || !query.trim()) return str;
            try {
                return str.replace(new RegExp(`(${query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
            } catch { return str; }
        }

        function formatAddress(addr, query) {
            if (!addr) return '<span class="text-slate-500 italic">Sin domicilio</span>';
            const coordRegex = /(-?\d{1,2}\.\d+),\s*(-?\s*\d{1,3}\.\d+)/g;
            if (coordRegex.test(addr)) {
                return addr.replace(coordRegex, (m, lat, lon) => `<a href="https://www.google.com/maps/search/?api=1&query=${lat.trim()},${lon.trim()}" target="_blank" class="text-blue-400 hover:underline font-mono font-bold bg-blue-500/10 px-1 py-0.5 rounded border border-blue-500/20" onclick="event.stopPropagation();">📍 ${m}</a>`);
            }
            return highlightText(addr, query);
        }

        function switchTab(tab) {
            const searchView = el('view-search'), detailView = el('view-detail'), main = document.querySelector('main');
            if (tab === 'search') {
                searchView.classList.remove('hidden'); detailView.classList.add('hidden');
                const restore = () => { if (main) main.scrollTop = lastScrollPosition; window.scrollTo(0, lastScrollPosition); };
                restore(); setTimeout(restore, 10);
            } else {
                searchView.classList.add('hidden'); detailView.classList.remove('hidden');
                if (main) main.scrollTo({ top: 0, behavior: 'instant' }); window.scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function filterData(resetPage = true) {
            if (resetPage) currentPage = 1;
            const query = el('searchInput')?.value.toLowerCase().trim() || '', selectedCity = el('cityFilter')?.value || '';
            const grid = el('resultsGrid'), countEl = el('resultCount');

            if (!query && !selectedCity) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">Utiliza el buscador o selecciona una localidad para ver registros.</div>`;
                countEl.innerText = "Esperando búsqueda...";
                el('paginationTop').innerHTML = ''; el('paginationBottom').innerHTML = '';
                return;
            }

            const filtered = allData.filter(item => {
                if (selectedCity && normalizeText(item.CIUDAD) !== normalizeText(selectedCity)) return false;
                if (!query) return true;
                return Object.values(item).some(val => String(val).toLowerCase().includes(query));
            });

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * ITEMS_PER_PAGE, paginated = filtered.slice(start, start + ITEMS_PER_PAGE);
            countEl.innerText = `Mostrando ${filtered.length > 0 ? start + 1 : 0} al ${Math.min(start + ITEMS_PER_PAGE, filtered.length)} de ${filtered.length} coincidentes`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800 text-sm px-4">No se encontraron registros.</div>`;
                el('paginationTop').innerHTML = ''; el('paginationBottom').innerHTML = '';
                return;
            }

            grid.innerHTML = paginated.map(item => {
                const plates = [item.PLACA1, item.PLACA2, item.PLACA3, item.PLACA4].filter(Boolean);
                const hasMote = item.MOTE && item.MOTE.trim() !== '' && item.MOTE.toLowerCase() !== 'ninguno';
                const hasObs = item.OBSERVACIONES && item.OBSERVACIONES.trim() !== '';
                const isMuerto = hasObs && (item.OBSERVACIONES.toLowerCase().includes('muerto') || item.OBSERVACIONES.toLowerCase().includes('fallecido'));
                const photo = getPhotoUrl(item.DNI);

                return `
                    <div onclick="selectRecord(${item._internalId})" class="bg-slate-900 border ${isMuerto ? 'border-red-500/80' : 'border-slate-800'} hover:border-blue-500/50 rounded-xl p-2 sm:p-3 shadow-xl flex flex-col justify-between group transition-all space-y-1 cursor-pointer relative overflow-hidden">
                        ${isMuerto ? '<div class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-55"><div class="w-full h-2 bg-red-600 transform rotate-45 absolute"></div><div class="w-full h-2 bg-red-600 transform -rotate-45 absolute"></div></div>' : ''}
                        <div class="space-y-1 relative z-10">
                            ${hasMote ? `<div class="pb-0.5"><span class="text-amber-400 font-bold text-[9px] sm:text-xs tracking-wide truncate block w-full">${highlightText(item.MOTE, query)}</span></div>` : '<div class="h-1"></div>'}
                            
                            <!-- Bloque superior con Foto, Nombre, Año (verde) y Localidad (naranja) -->
                            <div class="flex items-center space-x-2 pb-1.5 border-b border-slate-800">
                                <div class="w-12 h-16 sm:w-20 sm:h-28 bg-slate-950 border border-slate-700/80 rounded-lg flex items-center justify-center flex-shrink-0 overflow-hidden relative">
                                    <span class="text-blue-400 font-extrabold text-xs sm:text-lg">${getInitials(item.NOMBRE)}</span>
                                    ${photo ? `<img src="${photo}" class="absolute inset-0 w-full h-full object-cover object-top rounded-lg z-10" onerror="handleImageError(this, '${item.DNI}')">` : ''}
                                </div>
                                <div class="min-w-0 flex-1 flex flex-col justify-between self-stretch py-0.5">
                                    <h3 class="text-[9px] sm:text-xs font-semibold text-white group-hover:text-blue-400 line-clamp-2">${highlightText(item.NOMBRE || 'SIN NOMBRE', query)}</h3>
                                    <div class="flex justify-between items-center pt-1">
                                        <!-- Año en el hueco verde (junto a la foto) -->
                                        <span class="text-slate-300 text-[8px] sm:text-[10px] font-mono font-bold">${item.FECHA || 'S/A'}</span>
                                        <!-- Ciudad en el hueco naranja (a la derecha) -->
                                        <span class="text-blue-400 text-[8px] sm:text-[10px] font-bold uppercase tracking-wider">${item.CIUDAD || 'LOCALIDAD'}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Bloque inferior de datos -->
                            <div class="space-y-0.5 text-[9px] sm:text-[11px] pt-0.5">
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800/80 flex justify-between">
                                    <span class="text-slate-400">DNI:</span><span class="text-slate-100 font-mono font-semibold">${highlightText(item.DNI || '-', query)}</span>
                                </div>
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800/80">
                                    <span class="text-slate-400 block text-[8px]">DOMICILIO:</span>
                                    <div class="text-slate-200 truncate">${formatAddress(item.DOMICILIO1, query)}</div>
                                </div>
                                <div class="bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800/80">
                                    <span class="text-slate-400 block text-[8px]">VEHÍCULOS:</span>
                                    <div class="flex flex-wrap gap-1">${plates.length ? plates.map(p => `<span class="bg-slate-900 px-1.5 rounded border border-slate-700 text-[8px] font-mono text-blue-300">🚗 ${highlightText(p, query)}</span>`).join('') : '<span class="text-slate-500 italic">Ninguno</span>'}</div>
                                </div>
                                ${hasObs ? `<div class="text-[9px] truncate ${isMuerto ? 'text-red-400 font-bold' : 'text-amber-200'}"><strong>Obs:</strong> ${highlightText(item.OBSERVACIONES.replace(/muerto/gi, 'FALLECIDO'), query)}</div>` : ''}
                            </div>
                        </div>
                        <div class="pt-1 flex justify-end border-t border-slate-800 relative z-10"><span class="text-[9px] text-blue-400 font-medium">Ver detalle →</span></div>
                    </div>`;
            }).join('');

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const html = totalPages <= 1 ? '' : `
                <div class="flex items-center justify-center space-x-3 py-3 bg-slate-900/50 rounded-2xl border border-slate-800 my-3 text-xs sm:text-sm">
                    <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 rounded-xl cursor-not-allowed"' : 'class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl cursor-pointer"'}>← Anterior</button>
                    <span class="text-slate-300 font-mono">Página <strong class="text-blue-400">${currentPage}</strong> de <strong class="text-slate-100">${totalPages}</strong></span>
                    <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 rounded-xl cursor-not-allowed"' : 'class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl cursor-pointer"'}>Siguiente →</button>
                </div>`;
            ['paginationTop', 'paginationBottom'].forEach(id => { if (el(id)) el(id).innerHTML = html; });
        }

        function changePage(p) {
            currentPage = p;
            filterData(false);
            el('resultsGrid')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetFilters() {
            el('searchInput').value = ''; el('cityFilter').value = '';
            filterData(true);
        }

        function selectRecord(id) {
            const main = document.querySelector('main');
            lastScrollPosition = main ? main.scrollTop : (window.pageYOffset || 0);
            const item = allData.find(d => d._internalId === parseInt(id, 10));
            if (!item) return;

            const plates = [item.PLACA1, item.PLACA2, item.PLACA3, item.PLACA4].filter(Boolean);
            const hasMote = item.MOTE && item.MOTE.trim() !== '' && item.MOTE.toLowerCase() !== 'ninguno';
            const hasObs = item.OBSERVACIONES && item.OBSERVACIONES.trim() !== '';
            const isMuerto = hasObs && (item.OBSERVACIONES.toLowerCase().includes('muerto') || item.OBSERVACIONES.toLowerCase().includes('fallecido'));
            const photo = getPhotoUrl(item.DNI);

            el('detailContainer').innerHTML = `
                <div class="bg-slate-900 rounded-2xl border ${isMuerto ? 'border-red-500/80' : 'border-slate-800'} p-3 sm:p-6 shadow-2xl space-y-3 relative overflow-hidden">
                    ${isMuerto ? '<div class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-40"><div class="w-full h-3 bg-red-600 transform rotate-45 absolute"></div><div class="w-full h-3 bg-red-600 transform -rotate-45 absolute"></div></div>' : ''}
                    <div class="flex items-center space-x-3 pb-3 border-b border-slate-800 relative z-10">
                        <div class="w-20 h-24 sm:w-32 sm:h-40 bg-slate-950 border border-slate-700 rounded-xl flex items-center justify-center flex-shrink-0 overflow-hidden relative">
                            <span class="text-blue-400 font-extrabold text-xl sm:text-3xl">${getInitials(item.NOMBRE)}</span>
                            ${photo ? `<img src="${photo}" class="absolute inset-0 w-full h-full object-cover object-top rounded-xl z-10" onerror="handleImageError(this, '${item.DNI}')">` : ''}
                        </div>
                        <div class="min-w-0 flex-1 space-y-1">
                            <div class="flex flex-wrap gap-1 items-center">
                                <span class="px-2 py-0.5 bg-blue-600 text-white rounded text-[10px] font-bold uppercase">${item.CIUDAD || 'LOCALIDAD'}</span>
                                ${hasMote ? `<span class="text-amber-400 font-bold text-xs truncate">${item.MOTE}</span>` : ''}
                            </div>
                            <h2 class="text-base sm:text-xl font-bold text-white leading-tight">${item.NOMBRE || 'SIN NOMBRE'}</h2>
                            <div class="flex justify-between text-[10px] text-slate-400 font-mono pt-1">
                                <span>ID: #${item._internalId}</span><span class="font-bold text-slate-300">Año: ${item.FECHA || 'S/A'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-1.5 text-xs relative z-10">
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 flex justify-between items-center">
                            <span class="text-slate-400">DNI / NIE:</span><span class="text-slate-100 font-mono font-bold">${item.DNI || 'No registrado'}</span>
                        </div>
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 space-y-0.5">
                            <span class="text-slate-400 block text-[10px] font-bold uppercase">Domicilio:</span>
                            <div class="text-slate-200">${formatAddress(item.DOMICILIO1, '')}</div>
                            ${item.DOMICILIO2 ? `<div class="text-slate-300 border-t border-slate-800 pt-0.5 mt-0.5">${formatAddress(item.DOMICILIO2, '')}</div>` : ''}
                            ${item.DOMICILIO3 ? `<div class="text-slate-300 border-t border-slate-800 pt-0.5 mt-0.5">${formatAddress(item.DOMICILIO3, '')}</div>` : ''}
                        </div>
                        <div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 space-y-1">
                            <span class="text-slate-400 block text-[10px] font-bold uppercase">Vehículos:</span>
                            <div class="flex flex-wrap gap-1">${plates.length ? plates.map(p => `<div class="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 font-mono text-blue-300 text-xs">🚗 ${p}</div>`).join('') : '<span class="text-slate-500 italic">Ninguno</span>'}</div>
                        </div>
                        ${hasObs ? `<div class="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 text-xs ${isMuerto ? 'border-red-500/40 bg-red-950/10' : ''}"><strong class="${isMuerto ? 'text-red-400' : 'text-amber-400'} block text-[10px] uppercase">Observaciones:</strong><span class="${isMuerto ? 'text-red-300 font-semibold' : 'text-slate-300'}">${item.OBSERVACIONES}</span></div>` : ''}
                    </div>
                </div>`;
            switchTab('detail');
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- Pantalla de Acceso -->
    <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-950 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6 text-center my-auto">
            <div class="inline-flex bg-blue-600/10 p-4 rounded-2xl text-blue-500 border border-blue-500/25">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="space-y-2">
                <h2 class="text-xl font-bold text-white">CONSULTA BBDD</h2>
                <p class="text-xs text-slate-400">Introduce la contraseña de acceso principal.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Contraseña..." autocomplete="current-password" onkeydown="if(event.key === 'Enter') verificarClave()" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base tracking-widest">
                <button type="button" onclick="verificarClave()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-sm shadow-lg transition-colors cursor-pointer">Entrar al Sistema</button>
                <p id="authError" class="text-xs text-red-500 hidden">Contraseña incorrecta.</p>
            </div>
        </div>
    </div>

    <!-- Aplicación Principal -->
    <div id="mainApp" style="display: none;" class="h-full flex-col">
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md flex-shrink-0">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white">CONSULTA BBDD</h1>
                        <p class="text-[10px] sm:text-xs text-slate-400">Base de datos unificada</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs">
                    <span id="dbStatusDot" class="w-3 h-3 rounded-full bg-amber-500 shadow-lg"></span>
                    <span id="dbStatusText" class="hidden md:inline text-slate-300">Cargando...</span>
                    <span class="hidden md:inline text-slate-600">|</span>
                    <span class="text-slate-300 font-mono">Registros: <strong id="totalDbCount" class="text-blue-400">0</strong></span>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-6 overflow-y-auto">
            <div id="view-search" class="space-y-4">
                <div class="bg-slate-900 p-3 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-1.5 relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </span>
                            <input type="text" id="searchInput" oninput="filterData()" placeholder="Nombre, DNI, NIE, Mote, Matrícula..." class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <select id="cityFilter" onchange="filterData()" class="w-full py-3 px-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer">
                                <option value="">Todas las localidades</option>
                            </select>
                        </div>
                        <div class="flex items-center">
                            <button type="button" onclick="resetFilters()" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-sm transition-colors flex items-center justify-center cursor-pointer">Limpiar filtros</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400 px-1">
                        <span id="resultCount">Cargando registros...</span>
                    </div>
                </div>

                <div id="paginationTop"></div>
                <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4"></div>
                <div id="paginationBottom"></div>
            </div>

            <div id="view-detail" class="hidden space-y-2 max-w-2xl mx-auto pb-4">
                <div class="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-xl border border-slate-800 sticky top-0 z-20 shadow-md">
